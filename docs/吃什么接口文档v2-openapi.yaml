components:
  securitySchemes:
    SaToken:
      type: apiKey
      in: header
      name: satoken
      description: 输入完整的 Bearer <tokenValue>。当前部署 tokenName=satoken；若部署修改 tokenName，应同步修改本安全方案。
  schemas:
    AccountStatusVOResponse:
      type: object
      properties:
        accountStatus:
          anyOf:
          - type: string
          - type: 'null'
        bannedAt:
          anyOf:
          - type: string
          - type: 'null'
        banReason:
          anyOf:
          - type: string
          - type: 'null'
        banExpireAt:
          anyOf:
          - type: string
          - type: 'null'
    ActivityDinnerDTOResponse:
      type: object
      properties:
        id:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        accountId:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        pictureUrl:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
        likesCount:
          anyOf:
          - type: integer
          - type: 'null'
        createdAt:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        updatedAt:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
    ActivityFoodDTOResponse:
      type: object
      properties:
        id:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        accountId:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        uploaderName:
          anyOf:
          - type: string
          - type: 'null'
        foodName:
          anyOf:
          - type: string
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
        provinceId:
          anyOf:
          - type: integer
          - type: 'null'
        cityId:
          anyOf:
          - type: integer
          - type: 'null'
        pictureUrl:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
        likesCount:
          anyOf:
          - type: integer
          - type: 'null'
        isLiked:
          anyOf:
          - type: boolean
          - type: 'null'
        createdAt:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        updatedAt:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
    ActivityLikeReqDTORequest:
      type: object
      properties:
        targetType:
          type: string
          minLength: 1
          pattern: ^(food|dinner)$
        activityId:
          type: integer
          format: int64
          minimum: 1
      required:
      - targetType
      - activityId
    AddCustomFoodTagsDTORequest:
      type: object
      properties:
