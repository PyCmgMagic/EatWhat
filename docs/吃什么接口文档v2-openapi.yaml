          type: array
          items:
            type: string
          maxItems: 20
          minItems: 1
      required:
      - names
    AddSystemFoodTagsDTORequest:
      type: object
      properties:
        tagIds:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 20
          minItems: 1
      required:
      - tagIds
    AdminFoodTagVOResponse:
      type: object
      properties:
        id:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
        usageCount:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        createdAt:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        updatedAt:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
