openapi: 3.1.0
info:
  title: EatWhat 业务服务 API
  version: auth-renewal-20261019
  description: '业务后端接口，按已发布 JAR 的 Spring 映射、参数注解及模型反射生成，排除中控、内部集群和诊断接口。默认 servers=/api，路径为后端实际映射，不自动去重 /api。当前会话头是
    satoken: Bearer <tokenValue>，以登录返回的 tokenName 为准。HTTP 200 也可能包含非零业务 code；角色、同意状态和集群可用性仍由服务端检查。时间输出兼容项目自定义毫秒序列化及默认
    ISO 转换器；当前双机授权有效期实测为 ISO 时间。'
servers:
- url: /api
  description: 业务入口反代前缀；后端根路径前拼接 /api
- url: http://{host}:{port}/api
  description: 已配置业务网关（18091），保留 /api；域名 HTTPS 反代由使用方配置
  variables:
    host:
      default: 51.79.204.39
    port:
      default: '18091'
- url: http://127.0.0.1:18090
  description: 业务主机本地直连：没有网关 /api 前缀；仅供服务器内或 SSH 隧道使用
paths:
  /activity/dinners:
    get:
      tags:
      - Activity
      operationId: ActivityController_listDinners_get
      summary: 动态：获取聚餐动态列表
      x-java-handler: you.v50to.eatwhat.controller.ActivityController#listDinners
      security:
      - SaToken: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: 业务响应；code=0 为成功，非零为业务错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_PageResult_ActivityDinnerDTOResponse'
        default:
          description: 错误响应；HTTP 状态码及 code/msg 需要共同判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: '分页获取年夜饭列表

        仅登录用户可访问'
    post:
      tags:
      - Activity
      operationId: ActivityController_publishDinner_post
      summary: 动态：发布聚餐动态
      x-java-handler: you.v50to.eatwhat.controller.ActivityController#publishDinner
      security:
      - SaToken: []
      x-required-roles:
      - verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityDinnerDTORequest'
      responses:
        '200':
          description: 业务响应；code=0 为成功，非零为业务错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_VoidResponse'
        default:
          description: 错误响应；HTTP 状态码及 code/msg 需要共同判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: '发布年夜饭

        仅通过认证（verified）的用户可发布


        需要角色：verified。角色以服务端返回为准，不由客户端声明。'
