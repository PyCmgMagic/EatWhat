    PublicConfigResponse:
      type: object
      properties:
        enabled:
          type: boolean
          description: 是否启用腾讯人机验证；生产默认 true。false 仅供显式关闭的隔离测试，此时初始化参数为 null。 字段必返，值非
            null。
