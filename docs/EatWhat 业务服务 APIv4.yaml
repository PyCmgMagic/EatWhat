            result=failure&code=<既有业务码>。
          headers:
            Location:
              description: App 使用 app.oauth-app-success-redirect（默认 https://v50to.you/app/auth/callback），网页使用
                app.oauth-success-redirect（默认 /home）。附加 result 和 code，不含 token、state、账号ID、学号或姓名；回调请求参数不能改变目标或来源。
