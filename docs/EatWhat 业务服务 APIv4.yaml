  /auth/captcha/config:
    get:
      tags:
      - Auth
      operationId: AuthController_captchaConfig_get
      summary: 【公开】登录与认证：获取本次腾讯人机验证初始化参数（禁止缓存）
      security: []
      responses:
        '200':
          description: 业务响应；code=0 为成功，非零为业务错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_PublicConfigResponse'
              examples:
                freshInitialization:
                  summary: 结构示例，已过期；实际参数每次调用重新生成，禁止复制复用
                  value:
                    code: 0
                    data:
                      enabled: true
                      provider: tencent-cloud-intl
                      appId: '123456789'
                      scriptUrl: https://ca.turing.captcha.qcloud.com/TJNCaptcha-global.js
                      aidEncrypted: MDEyMzQ1Njc4OTAxMjM0NWvZ11atw+1uzYmoIyt5rAQVPyMK9ZDavskPw5hcayeT
                      aidEncryptedType: cbc
                      expiresAt: 1710231372
                    msg: ok
                    timestamp: 1710144972000
                disabledForIsolatedTests:
                  summary: 仅显式关闭验证的隔离测试
                  value:
                    code: 0
                    data:
                      enabled: false
                      provider: tencent-cloud-intl
                      appId: null
                      scriptUrl: null
                      aidEncrypted: null
                      aidEncryptedType: null
                      expiresAt: null
                    msg: ok
                    timestamp: 1710144972000
                unavailable:
                  summary: 配置缺失或加密失败，停止初始化
                  value:
                    code: 50004
                    data: null
                    msg: 人机验证服务暂不可用，请稍后重试
                    timestamp: 1710144972000
          headers:
            Cache-Control:
              description: 本次短效参数禁止缓存。
              schema:
                type: string
                const: no-store
            Pragma:
              description: 兼容旧代理的禁止缓存响应头。
              schema:
                type: string
                const: no-cache
        default:
          description: 错误响应；HTTP 状态码及 code/msg 需要共同判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: '**权限：公开（无需登录）**


        腾讯云国际站 CAPTCHA 初始化。支持控制台同时开启 CaptchaAppId 强制校验和一次一密。每次调用均用服务端 AppSecretKey
        和新的安全随机 IV 生成 aidEncrypted，默认有效 120 秒，以 expiresAt（Unix 秒）为准。密钥不足 32 字节时循环补齐到
        32 字节；AES-256-CBC / PKCS7，明文为 appId&签发Unix秒&有效秒数，输出 Base64(IV + 密文)。


        每次新建 TencentCaptcha 实例前重新获取配置，将 aidEncrypted、aidEncryptedType 传给 SDK options。请求使用
        cache:no-store；客户端、CDN、反代及 Service Worker 不得缓存。取消、初始化错误、过期、发送失败和再次验证均获取新参数并创建新实例，不能用旧实例的
        reload/show 开始下一次验证。一次一密的 IV 消费检查由腾讯验证侧执行。


        此接口不发送短信或邮件，不调用腾讯云票据 API，不返回 AppSecretKey、SecretId、SecretKey 或 session token。配置缺失或加密失败返回
        50004。隔离测试显式关闭时 enabled=false，其余初始化字段为 null。完成前端验证后，仍需通过发送接口提交 ticket 和 randstr，只有后端核查通过才发送。本功能已部署到校内和新加坡，两站均启用人机验证。初始化参数查询与缺票据拦截已通过公网复测；真人挑战成功后的短信/邮件投递尚未完成端到端验收。完整示例见
        docs/architecture/tencent-captcha.md。'
