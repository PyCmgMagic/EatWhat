components:
  securitySchemes:
    RecoveryCapability:
      type: apiKey
      in: header
      name: X-Recovery-Capability
      description: 精确 PHONE_CHANGE 命令的恢复凭据；不授予普通登录或其他命令权限。
    LifecycleRecoveryCapability:
      type: apiKey
      in: header
      name: X-Lifecycle-Recovery
      description: 精确 subject/request 的生命周期恢复凭据；不授予普通登录权限。
    SaToken:
      type: apiKey
      in: header
      name: satoken
      description: 输入完整的 Bearer <tokenValue>。当前部署 tokenName=satoken；若部署修改 tokenName，应同步修改本安全方案。
  schemas:
    AcceptedResponse:
      type: object
      properties:
        accepted:
          type: integer
          description: 本批新接收的事件数量。 字段必返，值非 null。
        duplicates:
          type: integer
          description: 本批中已存在而被忽略的重复事件数量。 字段必返，值非 null。
      required:
      - accepted
      - duplicates
      additionalProperties: false
    AccountStatusVOResponse:
      type: object
      properties:
        accountStatus:
          type: string
          description: 账号状态：NORMAL 正常、BANNED 已封禁。 字段必返，值非 null。
        bannedAt:
          type:
          - string
          - 'null'
          description: 封禁时间，ISO 8601 字符串；未封禁时为 null。 字段必返，值可为 null。
        banReason:
          type:
          - string
          - 'null'
          description: 封禁原因；未封禁时可为 null。 字段必返，值可为 null。
        banExpireAt:
          type: 'null'
          description: 封禁到期时间，ISO 8601 字符串；永久封禁时为 null。 字段必返，当前响应值固定为 null。
      required:
      - accountStatus
      - bannedAt
      - banReason
      - banExpireAt
      additionalProperties: false
    ActionResponse:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
          description: 处理决定 UUID，即管理员提交处理时的 Idempotency-Key。 字段必返，值非 null。
        adminId:
          type:
          - integer
          - 'null'
          format: int64
          description: 处理的管理员数值 ID；该管理员账号已被清理时为 null。 字段必返，值可为 null。
        action:
          type: string
          description: 处理动作，当前固定为 RESOLVE。 字段必返，值非 null。
        outcome:
          type: string
          enum:
          - ACCEPTED
          - REJECTED
          - RESOLVED
          description: 处理结论：ACCEPTED、REJECTED 或 RESOLVED。 字段必返，值非 null。
        reply:
          type: string
          description: 给提交人的公开回复；没有回复时为空字符串。 字段必返，值非 null。
        internalNote:
          type: string
          description: 内部备注，仅管理端可见；没有时为空字符串。 字段必返，值非 null。
        createdAt:
          type: integer
          format: int64
          description: 处理时间，Unix 毫秒时间戳。 字段必返，值非 null。
      required:
      - decisionId
      - adminId
      - action
      - outcome
      - reply
      - internalNote
      - createdAt
      additionalProperties: false
