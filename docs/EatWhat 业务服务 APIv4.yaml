      required:
      - status
    ActivityVOResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 数值业务 ID，用于对应资源的详情、修改等接口。 字段必返，值非 null。
        code:
          type: string
          description: 活动的唯一业务代码，用于 /activity/{code} 等路径。 字段必返，值非 null。
        name:
          type: string
          description: 名称。 字段必返，值非 null。
        description:
          type:
          - string
          - 'null'
          description: 文字介绍。 字段必返，值可为 null。
        coverUrl:
          type:
          - string
          - 'null'
          description: 活动封面图片引用或地址。 字段必返，值可为 null。
        status:
          type: string
          description: 活动状态：DRAFT 草稿、ONLINE 已上线、OFFLINE 已下线；草稿仅管理员可见。 字段必返，值非 null。
        startsAt:
          type:
          - integer
          - 'null'
          format: int64
          description: 允许发布内容的开始时间，Unix 毫秒，包含该时刻；null 表示无开始限制。 字段必返，值可为 null。
        endsAt:
          type:
          - integer
          - 'null'
          format: int64
          description: 允许发布内容的结束时间，Unix 毫秒，不包含该时刻；null 表示无结束限制。 字段必返，值可为 null。
        postingOpen:
          type: boolean
          description: 当前是否处于可发布状态：活动 ONLINE，且当前时间在开始（含）到结束（不含）的窗口内；发布还需满足接口权限。 字段必返，值非
            null。
        sort:
          type: integer
          description: 活动展示排序值，值越小越靠前。 字段必返，值非 null。
        requireLocation:
          type: boolean
          description: 发布此活动的内容时是否必须填写省份和城市。 字段必返，值非 null。
        maxPictures:
          type: integer
          description: 每条活动内容允许上传的最大图片数量。 字段必返，值非 null。
        fieldSchema:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                description: extra 对象中的字段键。
              label:
                type: string
                description: 字段显示名称。
              type:
                type: string
                description: 字段类型。
                enum:
                - TEXT
                - NUMBER
                - BOOLEAN
                - SELECT
              required:
                type: boolean
                description: 发布内容时此扩展值是否必填。
              maxLength:
                type: integer
                description: 仅 TEXT 类型必返，文本最大字符数。
              min:
                type:
                - integer
                - 'null'
                description: 仅 NUMBER 类型必返，null 表示不限制下界。
              max:
                type:
                - integer
                - 'null'
                description: 仅 NUMBER 类型必返，null 表示不限制上界。
              options:
                type: array
                description: 仅 SELECT 类型必返，可选字符串列表。
                items:
                  type: string
            required:
            - key
            - label
            - type
            - required
            additionalProperties: false
            oneOf:
            - properties:
                type:
                  const: TEXT
                  description: 活动扩展字段的类型分支。
              not:
                anyOf:
                - required:
                  - max
                - required:
                  - min
                - required:
                  - options
              required:
              - maxLength
            - properties:
                type:
                  const: NUMBER
                  description: 活动扩展字段的类型分支。
              not:
                anyOf:
                - required:
                  - maxLength
                - required:
                  - options
              required:
              - max
              - min
            - properties:
                type:
                  const: BOOLEAN
                  description: 活动扩展字段的类型分支。
              not:
                anyOf:
                - required:
                  - max
                - required:
                  - maxLength
                - required:
                  - min
                - required:
                  - options
            - properties:
                type:
                  const: SELECT
                  description: 活动扩展字段的类型分支。
              not:
                anyOf:
                - required:
                  - max
                - required:
                  - maxLength
                - required:
                  - min
              required:
              - options
          description: 活动扩展字段定义，最多 10 项。每项 key 为 extra 中的键、label 为显示名称、type 为 TEXT/NUMBER/BOOLEAN/SELECT、required
            表示是否必填；TEXT 的 maxLength 为最大字符数，NUMBER 的 min/max 为数值边界（null 表示不限制），SELECT
            的 options 为可选字符串列表。 字段必返，值非 null。
        createdAt:
          type: integer
          format: int64
          description: 创建时间，Unix 毫秒时间戳。 字段必返，值非 null。
        updatedAt:
          type: integer
          format: int64
          description: 最后更新时间，Unix 毫秒时间戳。 字段必返，值非 null。
      required:
      - id
      - code
      - name
      - description
      - coverUrl
      - status
      - startsAt
      - endsAt
      - postingOpen
      - sort
      - requireLocation
      - maxPictures
      - fieldSchema
      - createdAt
      - updatedAt
      additionalProperties: false
