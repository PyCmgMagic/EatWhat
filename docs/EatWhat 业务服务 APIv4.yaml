      - name: X-Captcha-Ticket
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
        description: 人机验证开启时必填；来自同一次腾讯 SDK 成功回调的 ticket。有效期和单次消费由腾讯检查，不接受 trerror_
          容灾票据。不要放入 URL、日志或存储；每次发送均重新验证。仅隔离测试显式关闭人机验证时可省略。
      - name: X-Captcha-Randstr
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 人机验证开启时必填；来自同一次腾讯 SDK 成功回调的 randstr，必须与 ticket 对应。不要放入 URL、日志或存储；每次发送均重新验证。仅隔离测试显式关闭人机验证时可省略。
      responses:
        '200':
          description: 业务响应；code=0 为成功，非零为业务错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_ChallengeResponse'
              examples:
                captchaRequired:
                  summary: 缺少 ticket 或 randstr，未发送
                  value:
                    code: 30015
                    data: null
                    msg: 请先完成人机验证
                    timestamp: 1710144972000
                captchaInvalid:
                  summary: 无效、过期、重放或风险拒绝，未发送
                  value:
                    code: 30016
                    data: null
                    msg: 人机验证失败或已过期，请重新验证
                    timestamp: 1710144972000
                captchaUnavailable:
                  summary: 配置缺失或上游异常，未发送
                  value:
                    code: 50004
                    data: null
                    msg: 人机验证服务暂不可用，请稍后重试
                    timestamp: 1710144972000
                sent:
                  summary: 人机验证通过且原发送业务检查通过
                  value:
                    code: 0
                    data:
                      challengeId: 00000000-0000-0000-0000-000000000001
                      expiresAt: '2026-11-01T00:05:00Z'
                      attempted: true
                    msg: ok
                    timestamp: 1710144972000
        default:
          description: 错误响应；HTTP 状态码及 code/msg 需要共同判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: '**权限：需登录；首次绑定手机号还需已有验证记录（已认证），否则 NO_PERMISSION（服务层校验）**


        **腾讯人机验证（机制双站已部署、默认开启；本接口来自当前源码，上线状态见部署状态）：**先 GET /auth/captcha/config 获取本次新的
        aidEncrypted，初始化腾讯 SDK，完成验证后以 X-Captcha-Ticket 和 X-Captcha-Randstr 请求头提交同一次回调的票据。后端使用请求来源
        IP 和服务端配置向 captcha.intl.tencentcloudapi.com 核查，仅 CaptchaCode=1 且未标记恶意时进入原发送逻辑；前端
        ret=0 或 HTTP 200 不能代替后端校验。缺少票据/随机串返回30015，无效/过期/重放/风险拒绝返回30016，配置或上游故障返回50004，均不发送。请求结束后即丢弃本次票据及初始化参数，重试时重新验证；原有登录、角色、用途和发送限流继续执行。


        **部署状态（2026-10-30）：两站均未上线。** 此接口来自当前源码，不在该日核对的两站运行包注册路由内；部署前不可调用，上线时间以后续发布记录为准。'
