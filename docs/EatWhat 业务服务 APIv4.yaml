    FoodRecommendationVOResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 数值业务 ID，用于对应资源的详情、修改等接口。 字段必返，值非 null。
        accountId:
          type:
          - integer
          - 'null'
          format: int64
          description: 发布者的数值账号 ID；游客访问时不披露，可能为 null。 字段必返，值可为 null。
        uploaderName:
          type:
          - string
          - 'null'
          description: 发布者的展示昵称。 字段必返，值可为 null。
        restaurantId:
          type: integer
          format: int64
          description: 所属餐厅的数值业务 ID。 字段必返，值非 null。
        restaurantName:
          type:
          - string
          - 'null'
          description: 所属餐厅名称。 字段必返，值可为 null。
        distanceMeters:
          type:
          - number
          - 'null'
          description: 用户到餐厅的直线距离，单位米；仅请求带位置的查询填充，其余为 null。 字段必返，值可为 null。
        restaurantAddress:
          type:
          - string
          - 'null'
          description: 餐厅文字地址，仅推荐接口填充。 字段必返，值可为 null。
        restaurantGcjLng:
          type:
          - number
          - 'null'
          description: 餐厅 GCJ-02 经度，单位为度，仅推荐接口填充。 字段必返，值可为 null。
        restaurantGcjLat:
          type:
          - number
          - 'null'
          description: 餐厅 GCJ-02 纬度，单位为度，仅推荐接口填充。 字段必返，值可为 null。
        hubId:
          type:
          - integer
          - 'null'
          format: int64
          description: 餐厅所属商圈 ID，仅推荐接口填充；无归属时可为 null。 字段必返，值可为 null。
        hubName:
          type:
          - string
          - 'null'
          description: 餐厅所属商圈名称，仅推荐接口填充；无归属时可为 null。 字段必返，值可为 null。
        name:
          type: string
          description: 名称。 字段必返，值非 null。
        description:
          type:
          - string
          - 'null'
          description: 文字介绍。 字段必返，值可为 null。
        price:
          type:
          - number
          - 'null'
          description: 菜品价格，单位元；未知价格时可为 null。 字段必返，值可为 null。
        category:
          type:
          - string
          - 'null'
          enum:
          - staple
          - drink
          - snack
          - dessert
          - soup
          - hot_pot
          - grill
          - cold_dish
          - side_dish
          - other
          - null
          description: 菜品分类代码：staple 主食、drink 饮品、snack 小吃、dessert 甜品、soup 汤类、hot_pot
            火锅、grill 烧烤、cold_dish 凉菜、side_dish 配菜、other 其他。 字段必返，值可为 null。
        categoryLabel:
          type:
          - string
          - 'null'
          description: 菜品分类的中文显示名称，对应 category。 字段必返，值可为 null。
        pictureUrl:
          type: array
          items:
            type: string
          description: 图片读取 URL 列表，可直接展示；可能含临时签名，失效后重新请求列表或详情获取。 字段必返，值非 null。
        pictureKeys:
          type: array
          items:
            type: string
          description: 持久化图片引用，用于编辑保留已有图片；pictureUrl只用于展示。历史非foods/引用应原样保留（不提交图片字段），或重新上传迁移。
            字段必返，值非 null。
        systemTags:
          type: array
          items:
            $ref: '#/components/schemas/FoodSystemTagVOResponse'
          description: 菜品的公共系统标签，包含标记人数和当前用户的标记状态。 字段必返，值非 null。
        myCustomTags:
          type: array
          items:
            $ref: '#/components/schemas/FoodTagSummaryVOResponse'
          description: 仅当前登录用户可见的个人菜品标签；游客为空列表。 字段必返，值非 null。
        isLiked:
          type: boolean
          description: 当前登录用户是否已点赞；游客为 false。 字段必返，值非 null。
        isFavorite:
          type: boolean
          description: 当前登录用户是否已收藏此菜品；游客为 false。 字段必返，值非 null。
        likesCount:
          type: integer
          description: 该内容收到的点赞总数。 字段必返，值非 null。
        mealTimes:
          type: array
          items:
            type: string
            enum:
            - breakfast
            - lunch
            - dinner
            - night
          description: 适合的饭点：breakfast 早饭、lunch 午饭、dinner 晚饭、night 夜宵；空列表表示不限饭点。 字段必返，值非
            null。
        stageColor:
          type:
          - string
          - 'null'
          enum:
          - broth
          - chili
          - mango
          - porcelain
          - bamboo
          - redoil
          - soy
          - matcha
          - tomato
          - null
          description: 菜品展示背景的舞台色，对应设计令牌 stage-<值>；null 时客户端按分类使用默认色。 字段必返，值可为 null。
        stageAlternates:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - broth
            - chili
            - mango
            - porcelain
            - bamboo
            - redoil
            - soy
            - matcha
            - tomato
          description: 舞台背景的两个备选色，与 stageColor 使用相同色值体系；设置时三色互不相同。 字段必返，值可为 null。
        coverCrop:
          anyOf:
          - $ref: '#/components/schemas/CoverCropDTOResponse'
          - type: 'null'
          description: 封面圆形裁切参数；null 时按居中内切圆显示，即 centerX=0.5、centerY=0.5、diameter=1。
            字段必返，值可为 null。
        removeBackground:
          type: boolean
          description: 自动去背景开关，默认 false；当前仅保存此设置，尚未生成去背景图片。 字段必返，值非 null。
        createdAt:
          type: integer
          format: int64
          description: 创建时间，Unix 毫秒时间戳。 字段必返，值非 null。
        updatedAt:
          type: integer
          format: int64
          description: 最后更新时间，Unix 毫秒时间戳。 字段必返，值非 null。
      required:
      - id
      - accountId
      - uploaderName
      - restaurantId
      - restaurantName
      - distanceMeters
      - restaurantAddress
      - restaurantGcjLng
      - restaurantGcjLat
      - hubId
      - hubName
      - name
      - description
      - price
      - category
      - categoryLabel
      - pictureUrl
      - pictureKeys
      - systemTags
      - myCustomTags
      - isLiked
      - isFavorite
      - likesCount
      - mealTimes
      - stageColor
      - stageAlternates
      - coverCrop
      - removeBackground
      - createdAt
      - updatedAt
      additionalProperties: false
      description: '**部署状态（2026-10-30）：两站已部署。** mealTimes、stageColor、stageAlternates、coverCrop、removeBackground
        已随 V72 在两站部署；removeBackground 只保存开关，自动图像去背景尚未实现。本次列表为空，字段部署依据为运行包模型及数据库结构。'
