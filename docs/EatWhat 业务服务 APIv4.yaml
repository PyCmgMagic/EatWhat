          description: 本站已接受的去重评分人数；评分汇总未就绪（ratingSummaryState=SYNC_PENDING）时为 null。
            字段必返，值可为 null。
        recommendationRate:
          type:
          - integer
          - 'null'
          description: 推荐率，0 至 100 的整数百分比；评分不足 5 人或汇总未就绪时为 null。 字段必返，值可为 null。
        isFavorite:
          type:
          - boolean
          - 'null'
          description: 当前登录用户是否已收藏该餐厅；游客或私有状态未就绪时为 null。 字段必返，值可为 null。
        ratingSummaryState:
          type: string
          description: 评分汇总状态：READY 可用，SYNC_PENDING 汇总缺失或已过期。 字段必返，值非 null。
        personalState:
          type: string
          description: 个人状态（收藏、我的评分）读取情况：READY 可用、NOT_LOGGED_IN 游客、SYNC_PENDING 暂不可确定。
            字段必返，值非 null。
        publicTastesState:
          type: string
          description: 公开口味汇总状态：READY 可用（已证明为空时 publicTastes 为空列表），SYNC_PENDING 汇总未就绪。
            字段必返，值非 null。
        myRating:
          type:
          - string
          - 'null'
          enum:
          - RECOMMEND
          - GOOD
          - AVERAGE
          - NOT_RECOMMEND
          - null
          description: 当前登录用户对该餐厅的有效评分：RECOMMEND 推荐、GOOD 不错、AVERAGE 一般、NOT_RECOMMEND
            不推荐；未评分、游客或状态未就绪时为 null。 字段必返，值可为 null。
        signatureFoods:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFoodSummaryResponse'
          description: 该餐厅点赞最多的至多 3 道可见菜品摘要；没有时为空列表。 字段必返，值非 null。
        matchedFoods:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFoodSummaryResponse'
          description: 按搜索关键词匹配到的至多 3 道可见菜品摘要；未带关键词或没有匹配时为空列表。 字段必返，值非 null。
        publicTastes:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantTasteSummaryResponse'
          description: 公开口味标签汇总，至多 6 项；没有时为空列表。 字段必返，值非 null。
        coverUrl:
          type:
          - string
          - 'null'
          description: 封面图读取地址，取自第一道招牌菜的首图；没有招牌菜图片时为 null。 字段必返，值可为 null。
        stageColor:
          type:
          - string
          - 'null'
          description: 舞台色，取自第一道招牌菜；没有招牌菜或该菜未设置时为 null。 字段必返，值可为 null。
        address:
          type:
          - string
          - 'null'
          description: 餐厅的文字地址。 字段必返，值可为 null。
        cityId:
          type:
          - integer
          - 'null'
          description: 城市 ID，对应城市字典接口。 字段必返，值可为 null。
        location:
          type: object
          properties:
            type:
              type: string
              const: Point
              description: 几何类型：Point 为点，MultiPolygon 为多面边界。
            coordinates:
              type: array
              items: {}
              description: GeoJSON 形式的 WGS84 坐标，点为 [经度, 纬度]，MultiPolygon 按多边形、环、坐标点逐层嵌套。
            srid:
              type: integer
              description: 空间参考系编号，4326 表示 WGS84；仅存储的 SRID 大于 0 时返回。
          required:
          - type
          - coordinates
          description: 餐厅位置的 WGS84 几何坐标；地图展示使用 gcjLng/gcjLat 的 GCJ-02 坐标。 字段必返，值非
            null。
        gcjLng:
          type: number
          description: GCJ-02（火星坐标系）经度，单位为度；地图展示使用此坐标系。 字段必返，值非 null。
        gcjLat:
          type: number
          description: GCJ-02（火星坐标系）纬度，单位为度；地图展示使用此坐标系。 字段必返，值非 null。
        hubId:
          type:
          - integer
          - 'null'
          format: int64
          description: 所属商圈的数值业务 ID；未归属商圈时可为 null。 字段必返，值可为 null。
        POI:
          type:
          - string
          - 'null'
