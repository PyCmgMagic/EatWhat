    ConsentChallengeResponse:
      type: object
      properties:
        status:
          type: string
          description: 跨站同意状态：NOT_GRANTED 未同意、PROVISIONAL 临时受理待协调、GRANTED 已同意、WITHDRAWN
            已撤回、CONFLICT 身份或授权存在冲突；GRANTED 本身不代表已取得登录令牌。
        policyVersion:
          type: string
          description: 跨站同步同意政策的版本号；提交同意时须使用当前政策版本。
        identityReady:
          type: boolean
          description: 当前站点的账号身份投影是否就绪；true 不代表所有业务数据已同步或已登录。
        backfillStatus:
          type: string
          description: 历史数据补同步进度，如 NOT_STARTED 未开始、ACCOUNT_PENDING 账号待同步、ACCOUNT_COMPLETE_DOMAINS_PENDING
            账号完成但业务域待同步、CONFLICT 有冲突。
        cleanupStatus:
          type: string
          description: 撤回后的清理进度，如 NOT_REQUIRED 无需清理、ACCOUNT_CLEARED_EFFECTS_PENDING
            账号已清理但后续处理待完成；不等同于所有副本已物理删除。
        registrationAccepted:
          type: boolean
          description: 本次注册请求是否已受理；true 不代表已登录或同步完成。
        consentProof:
          type: string
          description: 仅需同意且签发临时凭证时返回；不是登录令牌。
      description: 完整的同意进度字段；可附带 consentProof。没有本地同意记录时也可能只返回 consentProof。
      additionalProperties: false
      oneOf:
      - required:
        - status
        - policyVersion
        - identityReady
        - backfillStatus
        - cleanupStatus
        - registrationAccepted
      - required:
        - consentProof
        not:
          anyOf:
          - required:
            - status
          - required:
            - policyVersion
          - required:
            - identityReady
          - required:
            - backfillStatus
          - required:
            - cleanupStatus
          - required:
            - registrationAccepted
    PhoneLoginDataResponse:
