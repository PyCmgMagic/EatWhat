    post:
      tags:
      - User
      operationId: UserController_getCode_post
      summary: 【需verified】用户与关注：发送验证码
      security:
      - SaToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeReqRequest'
      parameters:
      - name: X-Captcha-Ticket
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
        description: 人机验证开启时必填；来自同一次腾讯 SDK 成功回调的 ticket。有效期和单次消费由腾讯检查，不接受 trerror_
          容灾票据。不要放入 URL、日志或存储；每次发送均重新验证。仅隔离测试显式关闭人机验证时可省略。
      - name: X-Captcha-Randstr
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 人机验证开启时必填；来自同一次腾讯 SDK 成功回调的 randstr，必须与 ticket 对应。不要放入 URL、日志或存储；每次发送均重新验证。仅隔离测试显式关闭人机验证时可省略。
      responses:
        '200':
          description: 业务响应；code=0 为成功，非零为业务错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result_VoidResponse'
              examples:
                captchaRequired:
                  summary: 缺少 ticket 或 randstr，未发送
                  value:
                    code: 30015
                    data: null
                    msg: 请先完成人机验证
                    timestamp: 1710144972000
                captchaInvalid:
                  summary: 无效、过期、重放或风险拒绝，未发送
                  value:
                    code: 30016
                    data: null
                    msg: 人机验证失败或已过期，请重新验证
                    timestamp: 1710144972000
                captchaUnavailable:
                  summary: 配置缺失或上游异常，未发送
                  value:
                    code: 50004
                    data: null
                    msg: 人机验证服务暂不可用，请稍后重试
                    timestamp: 1710144972000
                sent:
                  summary: 人机验证通过且原发送业务检查通过
                  value:
                    code: 0
                    data: null
                    msg: ok
                    timestamp: 1710144972000
        default:
          description: 错误响应；HTTP 状态码及 code/msg 需要共同判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: '**权限：需登录 + 已认证用户 verified（服务层校验，未认证返回 STATE_NOT_ALLOWED）**


        根据请求参数和客户端 IP 发送验证码


        需登录且具备 verified 角色；验证码绑定当前账号与请求的业务用途，不能用于匿名手机号登录。短信验证码有效期为 5 分钟；同一手机号的 60
        秒发送间隔跨站共享。错误次数跨站累计，最多 5 次；成功消费后两站均不能再次使用。验证码绑定手机号及业务用途，需登录的验证码还绑定当前账号；不能跨用途或跨账号使用。校内与新加坡支持双向跨站校验，客户端无需返回签发站；后端自动选择验证码归属站点并通过认证通道转发。归属站点或站间通道不可用时返回
        50001（服务暂不可用），不在本站另建状态或绕过校验。


        **腾讯人机验证（双站已部署，默认开启）：**先 GET /auth/captcha/config 获取本次新的 aidEncrypted，初始化腾讯
        SDK，完成验证后以 X-Captcha-Ticket 和 X-Captcha-Randstr 请求头提交同一次回调的票据。后端使用请求来源 IP
        和服务端配置向 captcha.intl.tencentcloudapi.com 核查，仅 CaptchaCode=1 且未标记恶意时进入原发送逻辑；前端
        ret=0 或 HTTP 200 不能代替后端校验。缺少票据/随机串返回30015，无效/过期/重放/风险拒绝返回30016，配置或上游故障返回50004，均不发送。请求结束后即丢弃本次票据及初始化参数，重试时重新验证；原有登录、角色、用途和发送限流继续执行。'
