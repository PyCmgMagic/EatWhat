openapi: 3.1.0
info:
  title: EatWhat 业务服务 API
  version: source-contract-20261101
  description: '业务后端接口，按指定构建 JAR 的 Spring 映射、参数注解及模型反射生成，排除中控、内部集群和诊断接口。默认 servers=/api，路径为后端实际映射，不自动去重
    /api。当前会话头是 satoken: Bearer <tokenValue>，以登录返回的 tokenName 为准。HTTP 200 也可能包含非零业务
    code；角色、同意状态和集群可用性仍由服务端检查。日期/时间字段输出 ISO 8601 字符串（Spring Boot 默认 JsonMapper）；createdAt
    等 Long 字段为 Unix 毫秒。本文件是按当前源码构建包离线生成的“完整源码契约”，包含尚未上线的接口；线上实际注册的接口以冻结的线上规范为准，未上线接口在各自描述里标注“两站均未上线”。部署状态按
    2026-10-30 校内、新加坡实际运行包、配置、数据库和代表性公网请求核对；逐接口说明区分已上线与源码独有接口，不表示所有业务分支均完成线上验收。'
servers:
- url: /api
  description: 业务入口反代前缀；后端根路径前拼接 /api
- url: http://{host}:{port}/api
  description: 业务网关 HTTP 回源地址，保留 /api；上游终止 HTTPS，仅开放 80/443
  variables:
    host:
      default: 51.79.204.39
    port:
      default: '443'
      enum:
      - '80'
      - '443'
- url: http://127.0.0.1:18090
  description: 业务主机本地直连：没有网关 /api 前缀；仅供服务器内或 SSH 隧道使用
