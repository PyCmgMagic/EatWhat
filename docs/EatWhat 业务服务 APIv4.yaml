          type: string
          enum:
          - tencent-cloud-intl
          description: 人机验证提供方，固定为 tencent-cloud-intl。 字段必返，值非 null。
        appId:
          type:
          - string
          - 'null'
          pattern: ^[1-9][0-9]*$
          description: 服务端配置的腾讯验证码应用 ID，作为字符串传给前端 SDK；关闭验证时为 null。 字段必返，值可为 null。
        scriptUrl:
          type:
          - string
          - 'null'
          format: uri
          description: 国际站官方前端 SDK 地址；关闭验证时为 null。 字段必返，值可为 null。
        aidEncrypted:
          type:
          - string
          - 'null'
          minLength: 1
          pattern: ^[A-Za-z0-9+/]+={0,2}$
          description: 本次新生成的短效初始化参数，标准 Base64(随机 16 字节 IV + AES-256-CBC 密文)。仅供本次新建验证实例使用；取消、失败、超时及再次验证都重新获取，禁止缓存、复用或记录日志。关闭验证时为
            null。 字段必返，值可为 null。
        aidEncryptedType:
          type:
          - string
          - 'null'
          enum:
          - cbc
          - null
          description: AppId 加密方式，开启验证时固定为 cbc，原样传入 TencentCaptcha options；关闭验证时为
            null。 字段必返，值可为 null。
        expiresAt:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 1
          description: 本次 aidEncrypted 到期时间，Unix 秒（不是毫秒，也不是 ticket 有效期）。默认签发后 120
            秒，服务端可配置；关闭验证时为 null。 字段必返，值可为 null。
      required:
      - enabled
      - provider
      - appId
      - scriptUrl
      - aidEncrypted
      - aidEncryptedType
      - expiresAt
      additionalProperties: false
      oneOf:
      - properties:
          enabled:
            const: true
            description: 人机验证开关分支。
          appId:
            not:
              type: 'null'
            description: 开启验证时初始化值非 null。
          scriptUrl:
            not:
              type: 'null'
            description: 开启验证时初始化值非 null。
          aidEncrypted:
            not:
              type: 'null'
            description: 开启验证时初始化值非 null。
          aidEncryptedType:
            not:
              type: 'null'
            description: 开启验证时初始化值非 null。
          expiresAt:
            not:
              type: 'null'
            description: 开启验证时初始化值非 null。
      - properties:
          enabled:
            const: false
            description: 人机验证开关分支。
          appId:
            type: 'null'
            description: 关闭验证时初始化值为 null。
          scriptUrl:
            type: 'null'
            description: 关闭验证时初始化值为 null。
          aidEncrypted:
            type: 'null'
            description: 关闭验证时初始化值为 null。
          aidEncryptedType:
            type: 'null'
            description: 关闭验证时初始化值为 null。
          expiresAt:
            type: 'null'
            description: 关闭验证时初始化值为 null。
