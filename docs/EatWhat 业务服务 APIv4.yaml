                  value: https://v50to.you/app/auth/callback?result=success&code=0
                appExpired:
                  summary: App 链接过期或重复回调
                  value: https://v50to.you/app/auth/callback?result=failure&code=30012
                appStudentTaken:
                  summary: 学号已认证过其他账号
                  value: https://v50to.you/app/auth/callback?result=failure&code=30013
                webSuccess:
                  summary: 网页认证成功
                  value: /home?result=success&code=0
                webBadToken:
                  summary: 网页学校 token 无效
                  value: /home?result=failure&code=50003
            Cache-Control:
              description: 禁止缓存认证回跳。
