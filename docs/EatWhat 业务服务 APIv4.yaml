          description: 图片读取 URL 列表，可直接展示；可能含临时签名，失效后重新请求列表或详情获取。 字段必返，值可为 null。
        createdAt:
          type: integer
          format: int64
          description: 创建时间，Unix 毫秒时间戳。 字段必返，值非 null。
        updatedAt:
          type: integer
          format: int64
          description: 最后更新时间，Unix 毫秒时间戳。 字段必返，值非 null。
