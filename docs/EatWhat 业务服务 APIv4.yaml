  /auth/callback/{state}:
    get:
      tags:
      - Auth
      operationId: AuthController_callbackWithState_get
      summary: 【公开】登录与认证：统一认证回跳（凭一次性 state）
      security: []
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: 认证成功与失败均回到服务端固定预设地址；无 JSON 结果体。成功为 result=success&code=0，失败为
            result=failure&code=<既有业务码>。
          headers:
            Location:
              description: App 使用 app.oauth-app-success-redirect（默认 https://v50to.you/app/auth/callback），网页使用
                app.oauth-success-redirect（默认 /home）。附加 result 和 code，不含 token、state、账号ID、学号或姓名；回调请求参数不能改变目标或来源。
              schema:
                type: string
                format: uri-reference
              examples:
                appSuccess:
                  summary: App 认证事务提交成功
                  value: https://v50to.you/app/auth/callback?result=success&code=0
                appExpired:
                  summary: App 链接过期或重复回调
                  value: https://v50to.you/app/auth/callback?result=failure&code=30012
                appStudentTaken:
                  summary: 学号已认证过其他账号
                  value: https://v50to.you/app/auth/callback?result=failure&code=30013
                webSuccess:
                  summary: 网页认证成功
                  value: /home?result=success&code=0
                webBadToken:
                  summary: 网页学校 token 无效
                  value: /home?result=failure&code=50003
            Cache-Control:
              description: 禁止缓存认证回跳。
              schema:
                type: string
                const: no-store
            Pragma:
              description: 兼容旧代理的禁止缓存声明。
              schema:
                type: string
                const: no-cache
            Referrer-Policy:
              description: 不向回跳目标披露学校回调URL。
              schema:
                type: string
                const: no-referrer
      description: '**权限：公开（凭一次性 state，不看当前会话）**


        原 Spring 方法未限制 HTTP 方法；此文档展开 GET/POST 两种调用，其他方法并未由文档新增。


        凭一次性 state 认证发起账号，不使用浏览器当前会话。state 五分钟后失效或已消费时仍可凭24小时来源提示选择固定失败目标；提示只含 app/web，不能认证。来源缺失或
        state 畸形时固定回 App 目标，code=30012。兼容有效旧记录的数字账号ID（web）与 app:<账号ID>。


        30012=认证链接无效/过期/重复，30013=学号已用于其他账号，50003=学校 token 无效；20005/20006及其他业务异常保留既有码，数据库/Redis/系统故障分别为90002/90003/90001。事务回滚或提交失败不能发送success或刷新成功权限缓存。客户端只用结果参数展示提示，认证状态须带原会话查询
        /user/info 或 /auth/verify。'
