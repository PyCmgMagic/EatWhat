  /auth/verify:
    get:
      tags:
      - Auth
      operationId: AuthController_verify_get
      summary: 【需登录】登录与认证：查询已完成认证类型
      security:
      - SaToken: []
      responses:
        '200':
          description: 业务响应；code=0 为成功，非零为业务错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码：0 为成功，非零为业务错误。
                  data:
                    type:
                    - array
                    - 'null'
                    maxItems: 1
                    items:
                      type: string
                      enum:
                      - verify:sso
                      - verify:school_email
                    description: 业务数据；键始终返回，值按业务状态和下列分支定义。
                  msg:
                    type: string
                    description: 业务结果提示信息。
                  timestamp:
                    type: integer
                    description: 响应生成时间，Unix 毫秒时间戳。
                    format: int64
                required:
                - code
                - data
                - msg
                - timestamp
                additionalProperties: false
                allOf:
                - if:
                    properties:
                      code:
                        const: 0
                    required:
                    - code
                  then:
                    properties:
                      data:
                        type: array
                        maxItems: 1
                        items:
                          type: string
                          enum:
                          - verify:sso
                          - verify:school_email
                        description: 已完成的认证方式；未认证时为空数组
                - if:
                    properties:
                      code:
                        not:
                          const: 0
                    required:
                    - code
                  then:
                    properties:
                      data:
                        type: 'null'
              example:
                code: 0
                data:
                - verify:school_email
                msg: ok
                timestamp: 1700000000000
        default:
          description: 错误响应；HTTP 状态码及 code/msg 需要共同判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: '**权限：需登录**


        校验三方认证是否完成


        data 为当前账号已完成的认证方式：verify:sso（山东大学统一认证）或 verify:school_email（学校邮箱）；未认证时为 []。'
