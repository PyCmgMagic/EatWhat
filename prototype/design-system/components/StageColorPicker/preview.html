<!-- @dsCard group="舞台" height=230 subtitle="点颜色，预览跟着变" -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StageColorPicker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); }
  .panel { margin: var(--space-20); width: 390px; box-sizing: border-box; padding: 18px var(--space-20) var(--space-20); border-radius: var(--radius-sheet); background: var(--crop-panel); color: var(--paper); display: flex; flex-direction: column; gap: var(--space-16); }
  .head { display: flex; align-items: center; gap: var(--space-16); }
  .title { flex: none; display: flex; flex-direction: column; font-size: 15px; line-height: 22px; font-weight: 600; }
  .title small { font-size: 12px; line-height: 18px; font-weight: 400; opacity: 0.7; }
  .chips { flex: 1; display: flex; justify-content: flex-end; gap: var(--space-14); }
  .chips button { width: 48px; padding: 0; border: 0; background: none; color: var(--paper); display: flex; flex-direction: column; align-items: center; gap: var(--space-4); font: 400 11px/16px var(--font-sans); cursor: pointer; }
  .sw { width: 36px; height: 36px; border-radius: 50%; }
  [aria-checked="true"] .sw { box-shadow: 0 0 0 3px var(--crop-panel), 0 0 0 5px #ffffff; }
  .card { position: relative; height: 84px; border-radius: var(--radius-tile); overflow: hidden; transition: background-color 300ms ease, color 300ms ease; }
  .card .words { position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; }
  .card small { font-size: 11px; line-height: 16px; opacity: 0.85; }
  .card b { font-size: 22px; line-height: 28px; font-weight: 900; }
  .plate { position: absolute; right: -10px; top: -8px; width: 100px; height: 100px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px #ffffff, 0 8px 16px rgba(0, 0, 0, 0.3); }
  .plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <span class="title">舞台颜色<small>从照片里推荐</small></span>
    <div class="chips" role="radiogroup" aria-label="舞台颜色" id="chips">
      <button type="button" role="radio" aria-checked="true" data-c="--stage-soy" data-on="--paper"><span class="sw" style="background: var(--stage-soy);"></span>酱色</button>
      <button type="button" role="radio" aria-checked="false" data-c="--stage-redoil" data-on="--paper"><span class="sw" style="background: var(--stage-redoil);"></span>红油</button>
      <button type="button" role="radio" aria-checked="false" data-c="--stage-chili" data-on="--ink"><span class="sw" style="background: var(--stage-chili);"></span>辣橙</button>
    </div>
  </div>
  <div class="card" id="card">
    <span class="words"><small>首页会是这样</small><b>柳州螺蛳粉</b></span>
    <span class="plate" aria-hidden="true"><img src="../../../assets/photos/sq_luosi.png" alt=""></span>
  </div>
</div>
<script>
  (function () {
    var chips = document.getElementById('chips'), card = document.getElementById('card');
    function apply(b) {
      chips.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
      card.style.background = 'var(' + b.dataset.c + ')';
      card.style.color = 'var(' + b.dataset.on + ')';
    }
    chips.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) apply(b); });
    apply(chips.querySelector('[aria-checked="true"]'));
  })();
</script>
</body>
</html>
