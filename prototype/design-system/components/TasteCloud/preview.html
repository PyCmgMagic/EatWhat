<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TasteCloud</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap">
<style>
  body { margin: 0; background: var(--paper); font-family: var(--font-sans); color: var(--ink); }
  .col { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-20); max-width: 420px; }
  h2 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 900; }
  .cloud { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 16px; }
  .cloud button { min-height: 44px; padding: 0; border: 0; background: none; color: var(--ink); display: flex; align-items: baseline; gap: 3px; cursor: pointer; font-family: var(--font-sans); }
  .n { font-family: var(--font-numeral); font-size: 13px; font-weight: 800; }
  .t1 { font-size: 28px; font-weight: 900; }
  .t2 { font-size: 21px; font-weight: 700; }
  .t3 { font-size: 17px; font-weight: 600; }
  .t4 { font-size: 15px; font-weight: 500; }
  .soft { color: var(--ink-muted); }
  .add { align-self: center; height: 32px; padding: 0 12px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-pill); background: none; font: 400 14px/20px var(--font-sans); color: var(--ink); }
</style>
</head>
<body>
<div class="col">
  <h2>大家怎么说</h2>
  <div class="cloud">
    <button type="button"><span class="t1">鲜虾大只</span><span class="n">31</span></button>
    <button type="button"><span class="t2">平价</span><span class="n">18</span></button>
    <button type="button" class="soft"><span class="t3">汤鲜</span><span class="n">12</span></button>
    <button type="button" class="soft"><span class="t4">排队久</span><span class="n">7</span></button>
    <button type="button" class="add">＋ 加标签</button>
  </div>
</div>
</body>
</html>
