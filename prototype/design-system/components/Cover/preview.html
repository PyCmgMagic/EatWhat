<!-- @dsCard height=288 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>舞台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .broth { fill: var(--stage-broth); }
  .redoil { fill: var(--stage-redoil); }
  .soy { fill: var(--stage-soy); }
  .deep { fill: var(--ink); }
  .slab { rx: var(--radius-sheet); }
  .sat { rx: var(--radius-tile); }
  .plate { fill: var(--paper); }
  .table { fill: none; stroke: var(--paper); stroke-width: 2; }
  .words { position: absolute; left: var(--space-24); bottom: var(--space-24); max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: 0.95; font-weight: 900; letter-spacing: -2px; color: var(--ink); }
  .tag { margin: var(--space-8) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      stage-broth 176×292 slab bled off the top (the colour people meet first) · stage-soy 160×292 bled off the top and right (where real photos land) · stage-redoil 128×152 · ink 128×72, the only neutral — about 45% of 960×288
        arrangement one tall slab with satellites, bottoms on one line space-24 above the edge, space-16 gutters
        pattern     the turntable from the Turntable and DishPlate rules: one table edge (a 2px arc in paper, the ground cut out) with seven plates (radius-plate discs in paper) riding it, the front plate largest
        scales      sides in space-8 multiples; gutters space-16; slabs radius-sheet, satellites radius-tile, plates radius-plate
      -->
      <rect class="broth slab" x="16" y="-28" width="176" height="292" rx="28"/>
      <rect class="deep sat" x="208" y="24" width="128" height="72" rx="22"/>
      <rect class="redoil sat" x="208" y="112" width="128" height="152" rx="22"/>
      <rect class="soy slab" x="352" y="-28" width="160" height="292" rx="28"/>
      <circle class="table" cx="240" cy="560" r="420"/>
      <circle class="plate" cx="240" cy="140" r="30"/>
      <circle class="plate" cx="124.2" cy="156.3" r="22"/>
      <circle class="plate" cx="355.8" cy="156.3" r="22"/>
      <circle class="plate" cx="17.4" cy="203.8" r="20"/>
      <circle class="plate" cx="462.6" cy="203.8" r="20"/>
      <circle class="plate" cx="-62" cy="268" r="18"/>
      <circle class="plate" cx="542" cy="268" r="18"/>
    </svg>
  </div>
  <div class="words">
    <p class="name">舞台</p>
    <p class="tag">沙软今天吃什么的界面规范：每道菜都是主角，颜色跟着菜走。</p>
  </div>
</div>
</body>
</html>
