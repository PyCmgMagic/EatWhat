<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 换手机号</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
input::placeholder{color:#B5A79C}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-SettingsAccount.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
    <section style="position: absolute; left: 20px; right: 20px; top: 104px; display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 32px; line-height: 40px; font-weight: 900;">换手机号<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">敬请期待</span></h1>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #6E625B;">现在是 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; color: #231C18;">138 **** 5678</span>，先输密码确认是你本人</p>
    </section>

    <div style="position: absolute; left: 20px; right: 20px; top: 204px; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <label for="cp-pwd" style="font-size: 13px; color: #6E625B;">登录密码</label>
        <span style="height: 48px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 -1.5px 0 #E6DED8;">
          <input id="cp-pwd" type="{{pwdType}}" autocomplete="current-password" value="{{pwd}}" onChange="{{setPwd}}" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-size: 20px; font-weight: 700; color: #231C18; letter-spacing: 1px;">
          <button type="button" onClick="{{toggleShow}}" aria-label="{{eyeLabel}}" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #6E625B; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{show}}" hint-placeholder-val="{{ false }}"><dc-import name="G-Icon" icon="eye" size="22" hint-size="22px,22px"></dc-import></sc-if>
            <sc-if value="{{hide}}" hint-placeholder-val="{{ true }}"><dc-import name="G-Icon" icon="eyeOff" size="22" hint-size="22px,22px"></dc-import></sc-if>
          </button>
        </span>
      </div>

      <label style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 13px; color: #6E625B;">新手机号</span>
        <span style="height: 48px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 -1.5px 0 #231C18;">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800;">+86</span>
          <span aria-hidden="true" style="width: 1px; height: 20px; background: #E6DED8;"></span>
          <input type="tel" inputmode="numeric" autocomplete="tel-national" value="{{phone}}" onChange="{{setPhone}}" placeholder="11 位手机号" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #231C18; letter-spacing: 0.5px;">
        </span>
      </label>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <label for="cp-code" style="font-size: 13px; color: #6E625B;">验证码，发到新手机号</label>
        <span style="height: 48px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 -1.5px 0 #E6DED8;">
          <input id="cp-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{code}}" onChange="{{setCode}}" placeholder="6 位数字" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #231C18; letter-spacing: 4px;">
          <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
            <button type="button" class="btn-light" onClick="{{send}}" style="flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 14px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">获取验证码</button>
          </sc-if>
          <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
            <span aria-live="polite" style="flex: none; font-size: 14px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">{{secs}}</span> 秒后重发</span>
          </sc-if>
        </span>
        <span style="margin-top: 6px; font-size: 12px; color: #6E625B;">验证码 5 分钟内有效，60 秒后可以重发</span>
      </div>
    </div>

    <div style="position: absolute; left: 20px; right: 20px; top: 528px;">
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
        <button type="button" class="btn-solid" onClick="{{submit}}" style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">换绑</button>
      </sc-if>
      <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
        <button type="button" disabled style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: #E9E2DC; color: #8A7E76; font-size: 16px; font-weight: 600; cursor: not-allowed;">换绑</button>
      </sc-if>
    </div>

    <p style="position: absolute; left: 20px; right: 20px; bottom: 40px; margin: 0; font-size: 12px; line-height: 18px; color: #6E625B;">更换手机号功能正在准备中，敬请期待。如需帮助，可以联系平台管理员。</p>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <section role="status" style="position: absolute; left: 20px; right: 20px; top: 220px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
      <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="check" size="30" hint-size="30px,30px"></dc-import></span>
      <h1 style="margin: 4px 0 0; font-size: 24px; line-height: 32px; font-weight: 900;">换好了</h1>
      <p style="margin: 0; font-size: 15px; line-height: 24px; color: #4A3C31;">以后用 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">{{masked}}</span> 登录和找回密码</p>
      <a href="G-SettingsAccount.dc.html" class="btn-light" style="align-self: stretch; margin-top: 18px; height: 52px; border-radius: 26px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">回到账号与安全</a>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pwd: 'chifan2026', phone: '139 8765 4321', code: '', sent: false, requested: false, secs: 60, show: false, done: false };
    this.timer = null;
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const sent = this.state.sent;
    const digits = this.state.phone.replace(/\D/g, '');
    const masked = digits.length === 11 ? digits.slice(0, 3) + ' **** ' + digits.slice(7) : this.state.phone;
    const ready = this.state.pwd.length > 0 && this.state.requested && this.state.code.length === 6;
    return {
      pwd: this.state.pwd,
      phone: this.state.phone,
      code: this.state.code,
      masked: masked,
      sent: sent,
      notSent: !sent,
      secs: this.state.secs,
      pwdType: this.state.show ? 'text' : 'password',
      show: this.state.show,
      hide: !this.state.show,
      eyeLabel: this.state.show ? '隐藏密码' : '显示密码',
      ready: ready,
      notReady: !ready,
      editing: !this.state.done,
      done: this.state.done,
      setPwd: (e) => this.setState({ pwd: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      setCode: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6) }),
      toggleShow: () => this.setState({ show: !this.state.show }),
      submit: () => {
        if (this.timer) clearInterval(this.timer);
        this.timer = null;
        this.setState({ done: true });
      },
      send: () => {
        this.setState({ sent: true, requested: true, secs: 60 });
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
          const next = this.state.secs - 1;
          if (next <= 0) {
            clearInterval(this.timer);
            this.timer = null;
            this.setState({ sent: false, secs: 60 });
          } else {
            this.setState({ secs: next });
          }
        }, 1000);
        setTimeout(() => { if (!this.state.code) this.setState({ code: '135790' }); }, 1200);
      }
    };
  }
}
</script>
</body>
</html>
