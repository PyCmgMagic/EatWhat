<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 写评论</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
textarea::placeholder{color:#9A8B80}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 12px; right: 16px; top: 46px; height: 44px; display: grid; grid-template-columns: 80px minmax(0, 1fr) 80px; align-items: center;">
    <a href="G-Comments.dc.html" style="height: 44px; padding: 0 8px; color: #231C18; font-size: 15px; text-decoration: none; display: flex; align-items: center;">取消</a>
    <span style="text-align: center; font-size: 16px; font-weight: 700;">{{title}}</span>
    <span style="display: flex; justify-content: flex-end;">
      <sc-if value="{{canSend}}" hint-placeholder-val="{{ true }}">
        <a href="G-Dish.dc.html" class="btn-solid" style="height: 36px; padding: 0 16px; border-radius: 18px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 4px 10px rgba(35,28,24,0.14);">发送</a>
      </sc-if>
      <sc-if value="{{cannotSend}}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled style="height: 36px; padding: 0 16px; border: 0; border-radius: 18px; background: #E9E2DC; color: #8A7E76; font-size: 14px; font-weight: 600; cursor: not-allowed;">发送</button>
      </sc-if>
    </span>
  </header>

  <div style="position: absolute; left: 20px; right: 20px; top: 104px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #4A3C31;">
    <img src="../assets/photos/sq_luosi.png" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
    <span style="display: flex; flex-direction: column;"><span style="font-weight: 600; color: #231C18;">柳州螺蛳粉</span><span style="font-size: 12px; color: #6E625B;">螺蛳粉研究所</span></span>
  </div>

  <label style="position: absolute; left: 20px; right: 20px; top: 156px; display: flex; flex-direction: column; gap: 6px;">
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">{{title}}</span>
    <textarea maxlength="200" value="{{text}}" onChange="{{setText}}" placeholder="{{hint}}" style="box-sizing: border-box; width: 100%; height: 200px; padding: 0; border: 0; resize: none; outline: none; background: transparent; font: inherit; font-size: 17px; line-height: 28px; color: #231C18;"></textarea>
    <span style="align-self: flex-end; font-size: 12px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">{{len}}</span> / 200</span>
  </label>

  <sc-if value="{{isComment}}" hint-placeholder-val="{{ true }}">
    <section aria-label="照片" style="position: absolute; left: 20px; right: 20px; top: 400px; display: flex; flex-direction: column; gap: 10px; padding-top: 16px; box-shadow: inset 0 1px 0 #EFE9E4;">
      <div style="display: flex; gap: 10px;">
        <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{ true }}">
          <span style="position: relative; width: 96px; height: 96px;">
            <img src="../assets/photos/p_luosi.png" alt="已加的照片 1" style="width: 96px; height: 96px; border-radius: 18px; object-fit: cover; display: block;">
            <button type="button" aria-label="去掉这张照片" onClick="{{removePhoto}}" style="position: absolute; right: -10px; top: -10px; width: 44px; height: 44px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center;">
              <span style="width: 24px; height: 24px; border-radius: 12px; background: #231C18; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF;"><dc-import name="G-Icon" icon="close" size="14" hint-size="14px,14px"></dc-import></span>
            </button>
          </span>
        </sc-if>
        <button type="button" onClick="{{addPhoto}}" style="width: 96px; height: 96px; box-sizing: border-box; border: 1.5px dashed #9A8B80; border-radius: 18px; background: none; color: #231C18; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px;">
          <dc-import name="G-Icon" icon="camera" size="24" hint-size="24px,24px"></dc-import>
          <span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;">{{count}}</span> / 3</span>
        </button>
      </div>
      <span style="font-size: 12px; line-height: 18px; color: #6E625B;">照片要是这道菜的实拍，会和上传者的照片一起出现在大图里</span>
    </section>
  </sc-if>
  <sc-if value="{{isReply}}" hint-placeholder-val="{{ false }}">
    <p style="position: absolute; left: 20px; right: 20px; top: 400px; margin: 0; padding-top: 16px; box-shadow: inset 0 1px 0 #EFE9E4; font-size: 12px; color: #6E625B;">回复只能写字，挂在小林这条评论下面</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["写评论","回复"],"default":"写评论"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const reply = (props.mode ?? '写评论') === '回复';
    this.state = { text: reply ? '' : '中辣刚好，酸笋很足。加了一份炸蛋，泡在汤里吸满了味道。', photo: true };
  }
  renderVals() {
    const reply = (this.props.mode ?? '写评论') === '回复';
    const hasPhoto = !reply && this.state.photo;
    const can = this.state.text.trim().length > 0 || hasPhoto;
    return {
      title: reply ? '回复' : '写一条',
      hint: reply ? '回复 小林' : '吃过的话，说两句',
      isReply: reply,
      isComment: !reply,
      text: this.state.text,
      len: this.state.text.length,
      hasPhoto: hasPhoto,
      count: hasPhoto ? 1 : 0,
      canSend: can,
      cannotSend: !can,
      setText: (e) => this.setState({ text: e.target.value.slice(0, 200) }),
      addPhoto: () => this.setState({ photo: true }),
      removePhoto: () => this.setState({ photo: false })
    };
  }
}
</script>
</body>
</html>
