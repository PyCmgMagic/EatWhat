<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 我的标签</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
input::placeholder{color:#B5A79C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 12px; top: 46px; height: 44px; display: flex; align-items: center; justify-content: space-between;">
    <a href="G-Me.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
    <button type="button" onClick="{{toggleEdit}}" style="height: 44px; padding: 0 8px; border: 0; background: none; color: #231C18; font-size: 15px; font-weight: 600;">{{editLabel}}</button>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 98px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: 34px; line-height: 42px; font-weight: 900;">我的标签<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800;">{{n}}</span></h1>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6E625B;"><dc-import name="G-Icon" icon="lock" size="16" hint-size="16px,16px"></dc-import>只有你自己看得见，删掉标签不影响菜</span>
  </section>

  <ul style="position: absolute; left: 0; right: 0; top: 190px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
    <sc-for list="{{tags}}" as="t" hint-placeholder-count="9">
      <li style="min-height: 56px; padding: 0 12px 0 20px; display: flex; align-items: center; gap: 12px;">
        <sc-if value="{{t.renaming}}" hint-placeholder-val="{{ false }}">
          <input type="text" maxlength="10" value="{{t.draft}}" onChange="{{t.setDraft}}" aria-label="改标签名" style="flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; box-shadow: inset 0 -1.5px 0 #231C18; font: inherit; font-size: 17px; font-weight: 700; color: #231C18;">
          <button type="button" onClick="{{t.save}}" style="flex: none; height: 44px; padding: 0 10px; border: 0; background: none; color: #231C18; font-size: 15px; font-weight: 600;">好了</button>
        </sc-if>
        <sc-if value="{{t.showing}}" hint-placeholder-val="{{ true }}">
          <a href="G-TagDishes.dc.html" style="flex: 1; min-width: 0; min-height: 60px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
            <span style="flex: 1; min-width: 0; font-size: 17px; font-weight: 700;">{{t.name}}</span>
            <span style="font-size: 13px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; color: #231C18;">{{t.count}}</span> 道菜</span>
            <sc-if value="{{t.plain}}" hint-placeholder-val="{{ true }}"><span style="display: flex; color: #6E625B;"><dc-import name="G-Icon" icon="chevronRight" size="20" hint-size="20px,20px"></dc-import></span></sc-if>
          </a>
          <sc-if value="{{t.edit}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="改名" onClick="{{t.rename}}" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #231C18; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="edit" size="20" hint-size="20px,20px"></dc-import></button>
            <button type="button" aria-label="删除" onClick="{{t.remove}}" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #231C18; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="delete" size="20" hint-size="20px,20px"></dc-import></button>
          </sc-if>
        </sc-if>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      edit: false,
      renaming: -1,
      draft: '',
      tags: [
        { name: '一个人吃', count: 12 },
        { name: '便宜大碗', count: 9 },
        { name: '考试周', count: 8 },
        { name: '宵夜', count: 6 },
        { name: '请客', count: 5 },
        { name: '减脂', count: 4 },
        { name: '下雨天', count: 3 },
        { name: '想再吃一次', count: 3 },
        { name: '带爸妈来', count: 2 }
      ]
    };
  }
  renderVals() {
    const edit = this.state.edit;
    return {
      n: 12,
      editLabel: edit ? '完成' : '管理',
      toggleEdit: () => this.setState({ edit: !edit, renaming: -1 }),
      tags: this.state.tags.map((t, i) => {
        const renaming = this.state.renaming === i;
        return {
          name: t.name,
          count: t.count,
          renaming: renaming,
          showing: !renaming,
          edit: edit,
          plain: !edit,
          draft: this.state.draft,
          setDraft: (e) => this.setState({ draft: e.target.value.slice(0, 10) }),
          rename: () => this.setState({ renaming: i, draft: t.name }),
          save: () => {
            const d = this.state.draft.trim();
            const next = this.state.tags.slice();
            if (d) next[i] = { name: d, count: t.count };
            this.setState({ tags: next, renaming: -1 });
          },
          remove: () => this.setState({ tags: this.state.tags.filter((_, j) => j !== i) })
        };
      })
    };
  }
}
</script>
</body>
</html>
