<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 登录设备</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-SettingsAccount.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 98px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 34px; line-height: 42px; font-weight: 900;">登录设备<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></h1>
    <span style="font-size: 14px; line-height: 22px; color: #6E625B;">看到不认识的设备，先让它下线，再改一下密码。</span>
  </section>

  <ul style="position: absolute; left: 0; right: 0; top: 200px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px;">
    <li style="min-height: 68px; padding: 0 20px; display: flex; align-items: center; gap: 14px;">
      <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #231C18; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="phone" size="22" hint-size="22px,22px"></dc-import></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 700;">iPhone 15</span>
        <span style="font-size: 13px; color: #6E625B;">这台设备，正在用</span>
      </span>
    </li>
    <sc-for list="{{others}}" as="d" hint-placeholder-count="2">
      <li style="min-height: 68px; padding: 0 20px; display: flex; align-items: center; gap: 14px;">
        <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #F4EFEB; color: #231C18; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{d.isWeb}}" hint-placeholder-val="{{ false }}"><dc-import name="G-Icon" icon="computer" size="22" hint-size="22px,22px"></dc-import></sc-if>
          <sc-if value="{{d.isPhone}}" hint-placeholder-val="{{ true }}"><dc-import name="G-Icon" icon="phone" size="22" hint-size="22px,22px"></dc-import></sc-if>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 700;">{{d.name}}</span>
          <span style="font-size: 13px; color: #6E625B;">{{d.when}}</span>
        </span>
        <button type="button" class="btn-light" onClick="{{d.kick}}" style="flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 14px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">下线</button>
      </li>
    </sc-for>
  </ul>

  <sc-if value="{{hasOthers}}" hint-placeholder-val="{{ true }}">
    <button type="button" class="btn-press" onClick="{{kickAll}}" style="position: absolute; left: 20px; right: 20px; bottom: 40px; height: 52px; box-sizing: border-box; border: 1.5px solid #231C18; border-radius: 26px; background: #FFFFFF; color: #231C18; font-size: 16px; font-weight: 600; box-shadow: inset 0 -3px 0 rgba(35,28,24,0.08), 0 1px 2px rgba(35,28,24,0.12); transition: transform 90ms ease;">让其他设备都下线</button>
  </sc-if>
  <sc-if value="{{noOthers}}" hint-placeholder-val="{{ false }}">
    <p style="position: absolute; left: 20px; right: 20px; bottom: 52px; margin: 0; text-align: center; font-size: 14px; color: #6E625B;">只有这台设备登录着</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      list: [
        { id: 'web', name: 'Chrome 网页版', when: 'Mac，昨天 22:14', web: true },
        { id: 'mi', name: '小米 14', when: '10 月 12 日', web: false }
      ]
    };
  }
  renderVals() {
    const list = this.state.list;
    return {
      others: list.map((d) => Object.assign({}, d, {
        isWeb: d.web,
        isPhone: !d.web,
        kick: () => this.setState({ list: this.state.list.filter((x) => x.id !== d.id) })
      })),
      hasOthers: list.length > 0,
      noOthers: list.length === 0,
      kickAll: () => this.setState({ list: [] })
    };
  }
}
</script>
</body>
</html>
