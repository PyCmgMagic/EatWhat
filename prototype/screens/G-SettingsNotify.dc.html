<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 通知</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
.btn-solid{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-Settings.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 98px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 34px; line-height: 42px; font-weight: 900;">通知<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></h1>
    <span style="font-size: 14px; line-height: 22px; color: #6E625B;">只告诉你和你有关的事，不推饭点提醒和活动</span>
  </section>

  <sc-if value="{{sysOff}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 20px; right: 20px; top: 182px; display: flex; align-items: center; gap: 12px;">
      <span style="flex: none; display: flex; color: #A8321C;"><dc-import name="G-Icon" icon="notifyOff" size="22" hint-size="22px,22px"></dc-import></span>
      <span style="flex: 1; font-size: 14px; line-height: 22px; color: #A8321C;">系统通知关着，下面的开关暂时不起作用</span>
      <button type="button" class="btn-solid" style="flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 14px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 4px 10px rgba(35,28,24,0.14);">去打开</button>
    </div>
  </sc-if>

  <section style="position: absolute; left: 0; right: 0; top: {{listTop}}px; display: flex; flex-direction: column;">
    <h2 style="margin: 0; padding: 0 20px 4px; font-size: 13px; font-weight: 600; color: #6E625B;">推送哪些</h2>
    <sc-for list="{{types}}" as="s" hint-placeholder-count="4">
      <div style="min-height: 64px; padding: 8px 20px; box-sizing: border-box; display: flex; align-items: center; gap: 14px;">
        <span style="flex: none; display: flex;"><dc-import name="G-Icon" icon="{{s.icon}}" size="22" hint-size="22px,22px"></dc-import></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span id="{{s.id}}" style="font-size: 16px;">{{s.label}}</span>
          <span style="font-size: 13px; line-height: 20px; color: #6E625B;">{{s.sub}}</span>
        </span>
        <button type="button" role="switch" aria-labelledby="{{s.id}}" aria-checked="{{s.on}}" onClick="{{s.flip}}" style="flex: none; width: 52px; height: 32px; padding: 3px; border: 0; border-radius: 16px; background: {{s.track}}; box-shadow: {{s.shadow}}; display: flex; justify-content: {{s.align}}; transition: background-color 180ms ease;">
          <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(35,28,24,0.28);"></span>
        </button>
      </div>
    </sc-for>
  </section>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; gap: 12px; padding-top: 16px; box-shadow: inset 0 1px 0 #EFE9E4;">
    <span style="flex: none; display: flex; color: #6E625B;"><dc-import name="G-Icon" icon="moon" size="20" hint-size="20px,20px"></dc-import></span>
    <span style="font-size: 13px; line-height: 20px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; color: #231C18;">23:00–08:00</span> 不推送，这段时间的消息只进消息页。网页版没有推送，消息都在消息页里。</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"system":{"editor":"enum","options":["系统通知开着","系统通知关着"],"default":"系统通知开着"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { comment: true, like: true, follow: true, system: true };
  }
  renderVals() {
    const sysOff = (this.props.system ?? '系统通知开着') === '系统通知关着';
    const sw = (key) => {
      const on = this.state[key];
      return {
        on: on ? 'true' : 'false',
        track: on ? 'linear-gradient(180deg, #3B312B, #231C18)' : '#E6DED8',
        shadow: on ? 'inset 0 -1px 0 rgba(0,0,0,0.28)' : 'inset 0 1px 2px rgba(35,28,24,0.12)',
        align: on ? 'flex-end' : 'flex-start',
        flip: () => { const next = {}; next[key] = !on; this.setState(next); }
      };
    };
    return {
      sysOff: sysOff,
      listTop: sysOff ? 248 : 182,
      types: [
        Object.assign({ id: 'n-comment', icon: 'comment', label: '评论和回复', sub: '一条一推' }, sw('comment')),
        Object.assign({ id: 'n-like', icon: 'heart', label: '赞和收藏', sub: '同一道菜 1 小时内的合成一条' }, sw('like')),
        Object.assign({ id: 'n-follow', icon: 'follow', label: '关注', sub: '有人关注了你' }, sw('follow')),
        Object.assign({ id: 'n-system', icon: 'announce', label: '系统消息', sub: '认证结果、反馈和举报的处理结果' }, sw('system'))
      ]
    };
  }
}
</script>
</body>
</html>
