<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 修改密码</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
input::placeholder{color:#B5A79C}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-SettingsAccount.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
    <h1 style="position: absolute; left: 20px; top: 98px; margin: 0; font-size: 34px; line-height: 42px; font-weight: 900;">修改密码</h1>

    <div style="position: absolute; left: 20px; right: 20px; top: 180px; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <label for="old-pwd" style="font-size: 13px; color: #6E625B;">现在的密码</label>
        <span style="height: 48px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 -1.5px 0 {{oldLine}};">
          <input id="old-pwd" type="{{oldType}}" autocomplete="current-password" value="{{old}}" onChange="{{setOld}}" aria-invalid="{{oldBad}}" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-size: 20px; font-weight: 700; color: #231C18; letter-spacing: 1px;">
          <button type="button" onClick="{{toggleOld}}" aria-label="{{oldEye}}" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #6E625B; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{oldShow}}" hint-placeholder-val="{{ false }}"><dc-import name="G-Icon" icon="eye" size="22" hint-size="22px,22px"></dc-import></sc-if>
            <sc-if value="{{oldHide}}" hint-placeholder-val="{{ true }}"><dc-import name="G-Icon" icon="eyeOff" size="22" hint-size="22px,22px"></dc-import></sc-if>
          </button>
        </span>
        <sc-if value="{{wrong}}" hint-placeholder-val="{{ false }}">
          <span role="alert" style="margin-top: 6px; display: flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 20px; color: #A8321C;">
            <span style="flex: none; margin-top: 1px;"><dc-import name="G-Icon" icon="warning" size="18" hint-size="18px,18px"></dc-import></span>
            <span>现在的密码不对</span>
          </span>
        </sc-if>
      </div>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <label for="new-pwd" style="font-size: 13px; color: #6E625B;">新密码</label>
        <span style="height: 48px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 -1.5px 0 #E6DED8;">
          <input id="new-pwd" type="{{newType}}" autocomplete="new-password" maxlength="64" value="{{pwd}}" onChange="{{setPwd}}" placeholder="6–64 位" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-size: 20px; font-weight: 700; color: #231C18; letter-spacing: 1px;">
          <button type="button" onClick="{{toggleNew}}" aria-label="{{newEye}}" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #6E625B; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{newShow}}" hint-placeholder-val="{{ false }}"><dc-import name="G-Icon" icon="eye" size="22" hint-size="22px,22px"></dc-import></sc-if>
            <sc-if value="{{newHide}}" hint-placeholder-val="{{ true }}"><dc-import name="G-Icon" icon="eyeOff" size="22" hint-size="22px,22px"></dc-import></sc-if>
          </button>
        </span>
        <span style="margin-top: 6px; font-size: 12px; line-height: 18px; color: #6E625B;">改完其他设备上的登录不会自动退出</span>
      </div>
    </div>

    <div style="position: absolute; left: 20px; right: 20px; top: 420px; display: flex; flex-direction: column; gap: 6px;">
      <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
        <button type="button" class="btn-solid" onClick="{{submit}}" style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">改好了</button>
      </sc-if>
      <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: #E9E2DC; color: #8A7E76; font-size: 16px; font-weight: 600; cursor: not-allowed;">改好了</button>
      </sc-if>
      <a href="G-ForgotPassword.dc.html" style="align-self: center; height: 44px; padding: 0 12px; color: #231C18; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">忘了现在的密码</a>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <section role="status" style="position: absolute; left: 20px; right: 20px; top: 220px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
      <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="check" size="30" hint-size="30px,30px"></dc-import></span>
      <h1 style="margin: 4px 0 0; font-size: 24px; line-height: 32px; font-weight: 900;">密码改好了</h1>
      <p style="margin: 0; font-size: 15px; line-height: 24px; color: #4A3C31;">下次登录用新密码</p>
      <a href="G-SettingsAccount.dc.html" class="btn-light" style="align-self: stretch; margin-top: 18px; height: 52px; border-radius: 26px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">回到账号与安全</a>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tip":{"editor":"enum","options":["无","现在的密码不对"],"default":"无"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { old: 'chifan2026', pwd: 'chifan2027', oldShow: false, newShow: false, done: false };
  }
  renderVals() {
    const wrong = (this.props.tip ?? '无') === '现在的密码不对';
    const ready = this.state.old.length > 0 && this.state.pwd.length >= 6 && this.state.pwd.length <= 64;
    return {
      old: this.state.old,
      pwd: this.state.pwd,
      wrong: wrong,
      oldBad: wrong ? 'true' : 'false',
      oldLine: wrong ? '#A8321C' : '#E6DED8',
      oldType: this.state.oldShow ? 'text' : 'password',
      oldShow: this.state.oldShow,
      oldHide: !this.state.oldShow,
      oldEye: this.state.oldShow ? '隐藏现在的密码' : '显示现在的密码',
      newType: this.state.newShow ? 'text' : 'password',
      newShow: this.state.newShow,
      newHide: !this.state.newShow,
      newEye: this.state.newShow ? '隐藏新密码' : '显示新密码',
      ready: ready,
      notReady: !ready,
      editing: !this.state.done,
      done: this.state.done,
      setOld: (e) => this.setState({ old: e.target.value }),
      setPwd: (e) => this.setState({ pwd: e.target.value.slice(0, 64) }),
      toggleOld: () => this.setState({ oldShow: !this.state.oldShow }),
      toggleNew: () => this.setState({ newShow: !this.state.newShow }),
      submit: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
