<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 账号密码登录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
input::placeholder{color:#B5A79C}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-Login.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 104px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 32px; line-height: 40px; font-weight: 900;">登录</h1>
    <p style="margin: 0; font-size: 14px; line-height: 22px; color: #6E625B;">用手机号或用户名都可以</p>
  </section>

  <div style="position: absolute; left: 20px; right: 20px; top: 204px; display: flex; flex-direction: column; gap: 26px;">
    <label style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; color: #6E625B;">手机号或用户名</span>
      <span style="height: 48px; display: flex; align-items: center; box-shadow: inset 0 -1.5px 0 #E6DED8;">
        <input type="text" autocomplete="username" autocapitalize="off" spellcheck="false" value="{{account}}" onChange="{{setAccount}}" placeholder="11 位手机号或用户名" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-size: 20px; font-weight: 700; color: #231C18;">
      </span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <label for="pwd" style="font-size: 13px; color: #6E625B;">密码</label>
      <span style="height: 48px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 -1.5px 0 {{line}};">
        <input id="pwd" type="{{pwdType}}" autocomplete="current-password" value="{{pwd}}" onChange="{{setPwd}}" placeholder="6–64 位" aria-invalid="{{invalid}}" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-size: 20px; font-weight: 700; color: #231C18; letter-spacing: 1px;">
        <button type="button" onClick="{{toggleShow}}" aria-label="{{eyeLabel}}" style="flex: none; width: 44px; height: 44px; border: 0; background: none; color: #6E625B; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{show}}" hint-placeholder-val="{{ false }}"><dc-import name="G-Icon" icon="eye" size="22" hint-size="22px,22px"></dc-import></sc-if>
          <sc-if value="{{hide}}" hint-placeholder-val="{{ true }}"><dc-import name="G-Icon" icon="eyeOff" size="22" hint-size="22px,22px"></dc-import></sc-if>
        </button>
      </span>
      <sc-if value="{{hasMsg}}" hint-placeholder-val="{{ true }}">
        <span role="alert" style="margin-top: 6px; display: flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 20px; color: #A8321C;">
          <span style="flex: none; margin-top: 1px;"><dc-import name="G-Icon" icon="warning" size="18" hint-size="18px,18px"></dc-import></span>
          <span>{{msg}}</span>
        </span>
      </sc-if>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 432px; display: flex; flex-direction: column; gap: 6px;">
    <sc-if value="{{canLogin}}" hint-placeholder-val="{{ true }}">
      <a href="G-HomePhoto.dc.html" class="btn-solid" style="height: 52px; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">登录</a>
    </sc-if>
    <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="height: 52px; border: 0; border-radius: 26px; background: #E9E2DC; color: #8A7E76; font-size: 16px; font-weight: 600; cursor: not-allowed;">登录</button>
    </sc-if>
    <a href="G-ForgotPassword.dc.html" style="align-self: center; height: 44px; padding: 0 12px; color: #231C18; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">忘了密码</a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; justify-content: center; gap: 4px; font-size: 14px; color: #6E625B;">
    还没有账号？<a href="G-PhoneLogin.dc.html" style="color: #231C18; font-weight: 600;">注册</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tip":{"editor":"enum","options":["无","密码不对","输错太多次"],"default":"密码不对"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { account: 'tianliang', pwd: 'chifan2026', show: false };
  }
  renderVals() {
    const tip = this.props.tip ?? '密码不对';
    const msgs = {
      '密码不对': '账号或密码不对',
      '输错太多次': '密码连续输错 5 次，15 分钟后再试，或者找回密码'
    };
    const msg = msgs[tip] || '';
    const locked = tip === '输错太多次';
    return {
      account: this.state.account,
      pwd: this.state.pwd,
      pwdType: this.state.show ? 'text' : 'password',
      show: this.state.show,
      hide: !this.state.show,
      eyeLabel: this.state.show ? '隐藏密码' : '显示密码',
      msg: msg,
      hasMsg: !!msg,
      invalid: tip === '密码不对' ? 'true' : 'false',
      line: tip === '密码不对' ? '#A8321C' : '#231C18',
      locked: locked,
      canLogin: !locked,
      setAccount: (e) => this.setState({ account: e.target.value }),
      setPwd: (e) => this.setState({ pwd: e.target.value }),
      toggleShow: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
