<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 新号码完成注册</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-PhoneLogin.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 104px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 900;">最后一步</h1>
    <p style="margin: 0; font-size: 14px; line-height: 22px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; color: #231C18;">138 **** 5678</span> 还没注册过，确认下面这一条就建好账号。</p>
  </section>

  <section style="position: absolute; left: 20px; right: 20px; top: 210px; display: flex; gap: 14px;">
    <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #F4EFEB; color: #231C18; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="earth" size="22" hint-size="22px,22px"></dc-import>
    </span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700;">账号信息存放在境外服务器</h2>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4A3C31;">包括手机号、认证得到的学号和姓名、照片和位置，存放在 [国家或地区]。这一条要单独同意，不同意就没法注册。</p>
      <a href="G-DataNotice.dc.html" style="align-self: flex-start; height: 36px; color: #231C18; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 2px;">看说明
        <dc-import name="G-Icon" icon="chevronRight" size="16" hint-size="16px,16px"></dc-import>
      </a>
    </div>
  </section>

  <div style="position: absolute; left: 20px; right: 20px; top: 382px; height: 1px; background: #EFE9E4;"></div>

  <label style="position: absolute; left: 20px; right: 20px; top: 400px; display: flex; align-items: flex-start; gap: 12px; padding: 6px 0; cursor: pointer;">
    <input type="checkbox" checked="{{agreed}}" onChange="{{toggle}}" style="flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: #231C18;">
    <span style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 15px; line-height: 24px; font-weight: 600;">同意把我的账号信息存放在境外服务器</span>
      <sc-if value="{{notAgreed}}" hint-placeholder-val="{{ true }}">
        <span style="font-size: 13px; line-height: 20px; color: #A8321C;">勾选后才能继续</span>
      </sc-if>
    </span>
  </label>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 32px; background: #FFFFFF; box-shadow: 0 -1px 0 #EFE9E4; display: flex; flex-direction: column; gap: 10px;">
    <sc-if value="{{agreed}}" hint-placeholder-val="{{ false }}">
      <a href="G-Verify.dc.html" class="btn-solid" style="height: 52px; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">完成注册</a>
    </sc-if>
    <sc-if value="{{notAgreed}}" hint-placeholder-val="{{ true }}">
      <button type="button" disabled style="height: 52px; border: 0; border-radius: 26px; background: #E9E2DC; color: #8A7E76; font-size: 16px; font-weight: 600; cursor: not-allowed;">完成注册</button>
    </sc-if>
    <span style="text-align: center; font-size: 12px; line-height: 18px; color: #6E625B;">以后想撤回，去设置里的账号与安全</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { agreed: false };
  }
  renderVals() {
    return {
      agreed: this.state.agreed,
      notAgreed: !this.state.agreed,
      toggle: () => this.setState({ agreed: !this.state.agreed })
    };
  }
}
</script>
</body>
</html>
