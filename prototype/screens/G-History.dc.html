<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 足迹</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 12px; top: 46px; height: 44px; display: flex; align-items: center; justify-content: space-between;">
    <a href="G-Me.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
    <button type="button" style="height: 44px; padding: 0 8px; border: 0; background: none; color: #231C18; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px;">清空<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></button>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 98px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font-size: 34px; line-height: 42px; font-weight: 900;">足迹</h1>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6E625B;"><dc-import name="G-Icon" icon="lock" size="16" hint-size="16px,16px"></dc-import>只有你自己看得见</span>
  </section>

  <div role="tablist" aria-label="足迹分类" style="position: absolute; left: 20px; right: 20px; top: 172px; display: flex; gap: 22px; align-items: baseline; height: 44px;">
    <button type="button" role="tab" aria-selected="{{tDish.on}}" onClick="{{tDish.pick}}" style="height: 44px; padding: 0; border: 0; background: none; color: {{tDish.fg}}; font-size: {{tDish.size}}px; font-weight: {{tDish.w}};">菜</button>
    <button type="button" role="tab" aria-selected="{{tShop.on}}" onClick="{{tShop.pick}}" style="height: 44px; padding: 0; border: 0; background: none; color: {{tShop.fg}}; font-size: {{tShop.size}}px; font-weight: {{tShop.w}};">店</button>
  </div>

  <ul style="position: absolute; left: 0; right: 0; top: 226px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <li>
        <a href="{{r.href}}" style="padding: 8px 20px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;">
          <sc-if value="{{r.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{r.img}}" alt="" style="flex: none; width: 56px; height: 56px; border-radius: 16px; object-fit: cover; display: block;"></sc-if>
          <sc-if value="{{r.noImg}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 56px; height: 56px; border-radius: 16px; background: #F4EFEB;"></span></sc-if>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 700;">{{r.title}}</span>
            <span style="font-size: 13px; color: #6E625B;">{{r.sub}}</span>
          </span>
          <span style="flex: none; font-size: 12px; color: #6E625B;">{{r.time}}</span>
        </a>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'dish' };
  }
  renderVals() {
    const tab = (key) => {
      const on = this.state.tab === key;
      return { on: on, fg: on ? '#231C18' : '#6E625B', size: on ? 17 : 15, w: on ? 900 : 400, pick: () => this.setState({ tab: key }) };
    };
    const dishes = [
      { title: '柳州螺蛳粉', sub: '螺蛳粉研究所', time: '12 分钟前', img: '../assets/photos/sq_luosi.png', href: 'G-Dish.dc.html' },
      { title: '铁锅炖大鹅', sub: '东北饭庄', time: '1 小时前', img: '../assets/photos/sq_tieguo.png', href: 'G-Dish.dc.html' },
      { title: '粘豆包', sub: '老街点心', time: '昨天', img: '../assets/photos/sq_niandou.png', href: 'G-Dish.dc.html' },
      { title: '红烧肉', sub: '家常小馆', time: '周一', img: '../assets/photos/sq_hongshao.png', href: 'G-Dish.dc.html' },
      { title: '玉米排骨汤', sub: '家常小馆', time: '周一', img: '../assets/photos/sq_paigu.png', href: 'G-Dish.dc.html' },
      { title: '鲜虾蟹籽云吞', sub: '袁记云饺', time: '10 月 18 日', img: '', href: 'G-Dish.dc.html' }
    ];
    const shops = [
      { title: '螺蛳粉研究所', sub: '万达金街 B1', time: '12 分钟前', img: '../assets/photos/sq_luosi.png', href: 'G-Detail.dc.html' },
      { title: '家常小馆', sub: '银座商城 2 层', time: '周一', img: '../assets/photos/sq_hongshao.png', href: 'G-Detail.dc.html' },
      { title: '老街点心', sub: '西门小吃街', time: '周日', img: '../assets/photos/sq_niandou.png', href: 'G-Detail.dc.html' },
      { title: '袁记云饺', sub: '万达金街 1 层', time: '10 月 18 日', img: '', href: 'G-Detail.dc.html' }
    ];
    const list = this.state.tab === 'dish' ? dishes : shops;
    return {
      tDish: tab('dish'),
      tShop: tab('shop'),
      rows: list.map((r) => Object.assign({}, r, { hasImg: !!r.img, noImg: !r.img }))
    };
  }
}
</script>
</body>
</html>
