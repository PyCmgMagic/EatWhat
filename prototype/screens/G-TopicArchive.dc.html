<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 往期专题</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-HomePhoto.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 98px; display: flex; flex-direction: column; gap: 2px;">
    <h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 34px; line-height: 42px; font-weight: 900;">往期专题<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></h1>
    <span style="font-size: 14px; color: #6E625B;">软件园，每周一期</span>
  </section>

  <ul style="position: absolute; left: 0; right: 0; top: 186px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
    <sc-for list="{{topics}}" as="t" hint-placeholder-count="5">
      <li>
        <a href="G-Topic.dc.html" style="min-height: 84px; padding: 0 20px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 17px; line-height: 24px; font-weight: 700;">「{{t.name}}」</span>
            <span style="font-size: 13px; color: #6E625B;">{{t.range}}</span>
          </span>
          <span aria-hidden="true" style="flex: none; display: flex;">
            <img src="{{t.a}}" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #FFFFFF;">
            <img src="{{t.b}}" alt="" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #FFFFFF;">
            <img src="{{t.c}}" alt="" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #FFFFFF;">
          </span>
        </a>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const luosi = '../assets/photos/sq_luosi.png';
    const tieguo = '../assets/photos/sq_tieguo.png';
    const niandou = '../assets/photos/sq_niandou.png';
    const hongshao = '../assets/photos/sq_hongshao.png';
    const paigu = '../assets/photos/sq_paigu.png';
    return {
      topics: [
        { name: '降温了喝碗汤', range: '10 月 13 日–10 月 19 日', a: paigu, b: tieguo, c: luosi },
        { name: '国庆留校不孤单', range: '9 月 29 日–10 月 7 日', a: hongshao, b: niandou, c: paigu },
        { name: '一个人也要好好吃', range: '9 月 22 日–9 月 28 日', a: luosi, b: hongshao, c: niandou },
        { name: '军训后的那顿饭', range: '9 月 15 日–9 月 21 日', a: tieguo, b: paigu, c: hongshao },
        { name: '开学第一顿', range: '9 月 1 日–9 月 7 日', a: niandou, b: luosi, c: tieguo }
      ]
    };
  }
}
</script>
</body>
</html>
