        <p style="margin: 0; font-size: 15px; line-height: 24px;">汤底够酸够臭，酸笋给得很大方。腐竹炸得脆，泡久了也不软。</p>

            <sc-if value="{{like1.on}}" hint-placeholder-val="{{ true }}"><dc-import name="G-Icon" icon="heartOn" size="18" hint-size="18px,18px"></dc-import></sc-if>
            <sc-if value="{{like1.off}}" hint-placeholder-val="{{ false }}"><dc-import name="G-Icon" icon="heart" size="18" hint-size="18px,18px"></dc-import></sc-if>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; color: #231C18;">{{like1.n}}</span>
          </button>
          <a href="G-WriteComment.dc.html" style="height: 40px; color: #231C18; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">回复</a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 2px 0 0 14px; box-shadow: inset 2px 0 0 #EFE9E4;">
          <p style="margin: 0; font-size: 14px; line-height: 22px;"><strong style="font-weight: 600;">阿哲</strong>　同意，加个炸蛋更香</p>

          <button type="button" style="align-self: flex-start; height: 32px; padding: 0; border: 0; background: none; color: #231C18; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 2px;">展开 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;">5</span> 条回复<dc-import name="G-Icon" icon="chevronDown" size="16" hint-size="16px,16px"></dc-import></button>
        </div>

    <article style="padding: 0 20px; display: flex; gap: 12px;">

          <button type="button" aria-pressed="false" style="height: 40px; padding: 0 10px; border: 0; background: none; color: #6E625B; display: flex; align-items: center; gap: 6px;"><dc-import name="G-Icon" icon="heart" size="18" hint-size="18px,18px"></dc-import><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800; color: #231C18;">23</span></button>
          <a href="G-WriteComment.dc.html" style="height: 40px; color: #231C18; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">回复</a>
        </div>
      </div>
    </article>

    <article style="padding: 0 20px; display: flex; gap: 12px;">
      <span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #8F5B24; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900;">安</span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 36px;">
          <span style="display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 600;">安安</span><span style="font-size: 12px; color: #6E625B;">10 月 16 日</span></span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'useful', liked: true };
  }
  renderVals() {
    const tab = (key) => {
      const on = this.state.tab === key;
      return { on: on, fg: on ? '#231C18' : '#6E625B', size: on ? 17 : 15, w: on ? 900 : 400, pick: () => this.setState({ tab: key }) };
    };
    const liked = this.state.liked;
    return {
      useful: tab('useful'),
      latest: tab('latest'),
      like1: { on: liked, off: !liked, fg: liked ? '#C9442B' : '#6E625B', n: liked ? 46 : 45, flip: () => this.setState({ liked: !liked }) }
    };
  }
}
</script>
</body>
