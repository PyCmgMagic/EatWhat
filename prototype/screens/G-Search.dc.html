<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 搜索</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
input::placeholder{color:#6E625B}
input[type=search]::-webkit-search-cancel-button{display:none}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 20px; right: 8px; top: 48px; height: 48px; display: flex; align-items: center; gap: 4px;">
    <label style="flex: 1; min-width: 0; height: 48px; padding: 0 6px 0 16px; box-sizing: border-box; border-radius: 24px; background: #F4EFEB; display: flex; align-items: center; gap: 10px;">
      <dc-import name="G-Icon" icon="search" size="20" hint-size="20px,20px"></dc-import>
      <input type="search" aria-label="搜菜名或店名" placeholder="搜菜名或店名" value="{{q}}" onChange="{{setQ}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: #231C18;">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ true }}">
        <button type="button" aria-label="清空" onClick="{{clearQ}}" style="flex: none; width: 36px; height: 36px; border: 0; background: none; color: #6E625B; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="closeCircle" size="18" hint-size="18px,18px"></dc-import></button>
      </sc-if>
    </label>
    <a href="G-HomePhoto.dc.html" style="flex: none; height: 44px; padding: 0 12px; color: #231C18; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">取消</a>
  </header>

  <sc-if value="{{showRecent}}" hint-placeholder-val="{{ false }}">
    <section style="position: absolute; left: 20px; right: 20px; top: 124px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #6E625B;">最近搜过</h2>
        <button type="button" onClick="{{clearRecent}}" style="height: 36px; padding: 0; border: 0; background: none; color: #231C18; font-size: 14px; font-weight: 600;">清空</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="6">
          <button type="button" onClick="{{r.pick}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #F4EFEB; color: #231C18; font-size: 14px;">{{r.word}}</button>
        </sc-for>
      </div>
      <sc-if value="{{recentEmpty}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 6px 0 0; font-size: 14px; color: #6E625B;">搜过的词会留在这里</p>
      </sc-if>
    </section>
  </sc-if>

  <sc-if value="{{showResults}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; top: 112px; bottom: 0;">
      <div role="tablist" aria-label="搜索结果" style="margin: 0 20px; display: flex; gap: 22px; align-items: baseline; height: 44px;">
        <button type="button" role="tab" aria-selected="{{tDish.on}}" onClick="{{tDish.pick}}" style="height: 44px; padding: 0; border: 0; background: none; color: {{tDish.fg}}; font-size: {{tDish.size}}px; font-weight: {{tDish.w}}; display: flex; align-items: baseline; gap: 4px;">菜<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800;">2</span><span style="align-self: center; font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px; color: #231C18;">待接入</span></button>
        <button type="button" role="tab" aria-selected="{{tShop.on}}" onClick="{{tShop.pick}}" style="height: 44px; padding: 0; border: 0; background: none; color: {{tShop.fg}}; font-size: {{tShop.size}}px; font-weight: {{tShop.w}}; display: flex; align-items: baseline; gap: 4px;">店<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 13px; font-weight: 800;">3</span></button>
      </div>

      <sc-if value="{{tDish.on}}" hint-placeholder-val="{{ true }}">
        <div style="margin: 10px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 14px; row-gap: 18px;">
          <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
            <img src="../assets/photos/p_luosi.png" alt="柳州螺蛳粉" style="width: 100%; height: 150px; border-radius: 22px; object-fit: cover; display: block;">
            <div style="display: flex; flex-direction: column;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">柳州螺蛳粉</h3><span style="display: flex; gap: 8px; font-size: 13px; color: #6E625B;">螺蛳粉研究所<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">600 m</span></span></div>
          </a>
          <a href="G-Dish.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;">
            <span aria-hidden="true" style="width: 100%; height: 150px; border-radius: 22px; background: #F4EFEB; display: block;"></span>
            <div style="display: flex; flex-direction: column;"><h3 style="margin: 0; font-size: 15px; font-weight: 600;">酸辣粉</h3><span style="display: flex; gap: 8px; font-size: 13px; color: #6E625B;">西门粉面<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">1.1 km</span></span></div>
          </a>
        </div>
      </sc-if>

      <sc-if value="{{tShop.on}}" hint-placeholder-val="{{ false }}">
        <div style="margin: 10px 20px 0; display: flex; flex-direction: column; gap: 18px;">
          <a href="G-Detail.dc.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;">
            <img src="../assets/photos/sq_luosi.png" alt="" style="flex: none; width: 64px; height: 64px; border-radius: 18px; object-fit: cover;">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <span style="font-size: 16px; font-weight: 700;">螺蛳粉研究所</span>
              <span style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 600; color: #231C18;">600 m</span>万达金街 B1</span>
              <span style="font-size: 13px; color: #6E625B;">有 柳州螺蛳粉 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; color: #231C18;">¥16</span></span>
            </span>
          </a>
          <a href="G-Detail.dc.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;">
            <span aria-hidden="true" style="flex: none; width: 64px; height: 64px; border-radius: 18px; background: #F4EFEB;"></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <span style="font-size: 16px; font-weight: 700;">西门粉面</span>
              <span style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 600; color: #231C18;">1.1 km</span>西门小吃街</span>
              <span style="font-size: 13px; color: #6E625B;">有 酸辣粉 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; color: #231C18;">¥12</span></span>
            </span>
          </a>
          <a href="G-Detail.dc.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;">
            <span aria-hidden="true" style="flex: none; width: 64px; height: 64px; border-radius: 18px; background: #F4EFEB;"></span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <span style="font-size: 16px; font-weight: 700; color: #6E625B;">桂林米粉王</span>
              <span style="display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 14px; font-weight: 600;">450 m</span>万达金街 2 层</span>
              <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #231C18;"><dc-import name="G-Icon" icon="pause" size="16" hint-size="16px,16px"></dc-import>这家店已经关门了</span>
            </span>
          </a>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{showNone}}" hint-placeholder-val="{{ false }}">
    <section style="position: absolute; left: 20px; right: 20px; top: 180px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #F4EFEB; color: #6E625B; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="search" size="28" hint-size="28px,28px"></dc-import></span>
      <h2 style="margin: 4px 0 0; font-size: 20px; line-height: 28px; font-weight: 900;">没找到「{{q}}」</h2>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #6E625B;">换个词试试。要是这家店还没人建过，你来建第一个。</p>
      <a href="G-NewShop.dc.html" class="btn-press" style="margin-top: 8px; height: 48px; padding: 0 22px; box-sizing: border-box; border: 1.5px solid #231C18; border-radius: 24px; background: #FFFFFF; color: #231C18; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px; box-shadow: inset 0 -3px 0 rgba(35,28,24,0.08), 0 1px 2px rgba(35,28,24,0.12); transition: transform 90ms ease;"><dc-import name="G-Icon" icon="add" size="18" hint-size="18px,18px"></dc-import>新建一家店</a>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["没输入","有结果","没找到"],"default":"有结果"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const start = props.start ?? '有结果';
    this.state = {
      q: start === '没输入' ? '' : (start === '没找到' ? '黄焖鸡' : '粉'),
      tab: 'dish',
      recent: ['螺蛳粉', '云吞', '麻辣香锅', '东北饭庄', '杨枝甘露', '粥']
    };
  }
  renderVals() {
    const q = this.state.q.trim();
    const hit = q !== '' && q.indexOf('黄焖鸡') < 0;
    const tab = (key) => {
      const on = this.state.tab === key;
      return { on: on, fg: on ? '#231C18' : '#6E625B', size: on ? 17 : 15, w: on ? 900 : 400, pick: () => this.setState({ tab: key }) };
    };
    return {
      q: this.state.q,
      hasQ: q !== '',
      showRecent: q === '',
      showResults: hit,
      showNone: q !== '' && !hit,
      recent: this.state.recent.map((w) => ({ word: w, pick: () => this.setState({ q: w, tab: 'dish' }) })),
      recentEmpty: this.state.recent.length === 0,
      tDish: tab('dish'),
      tShop: tab('shop'),
      setQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => this.setState({ q: '' }),
      clearRecent: () => this.setState({ recent: [] })
    };
  }
}
</script>
</body>
</html>
