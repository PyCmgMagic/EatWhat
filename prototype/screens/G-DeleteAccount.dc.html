<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 注销账号</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
input::placeholder{color:#B5A79C}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-SettingsAccount.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
    <article style="position: absolute; left: 20px; right: 20px; top: 98px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 32px; line-height: 40px; font-weight: 900;">注销账号<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></h1>
        <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4A3C31;">申请后有 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; color: #231C18;">7</span> 天冷静期，这期间账号不能用，重新登录就能撤销；<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; color: #231C18;">7</span> 天后彻底删除。</p>
      </div>

      <section style="display: flex; gap: 12px;">
        <span style="flex: none; margin-top: 1px; display: flex;"><dc-import name="G-Icon" icon="delete" size="20" hint-size="20px,20px"></dc-import></span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700;">会删除</h2>
          <span style="font-size: 14px; line-height: 22px; color: #4A3C31;">资料、认证信息、收藏、我的标签、足迹、评论和回复、关注关系、屏蔽列表。你给别人的赞、口味标签和店铺评价也会从计数里去掉。</span>
        </span>
      </section>

      <section style="display: flex; gap: 12px;">
        <span style="flex: none; margin-top: 1px; display: flex;"><dc-import name="G-Icon" icon="store" size="20" hint-size="20px,20px"></dc-import></span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700;">会保留</h2>
          <span style="font-size: 14px; line-height: 22px; color: #4A3C31;">你上传的菜和新建的店，它们是店铺菜单的一部分。上传者会显示「已注销用户」。</span>
        </span>
      </section>

      <section style="display: flex; gap: 12px;">
        <span style="flex: none; margin-top: 1px; display: flex;"><dc-import name="G-Icon" icon="phone" size="20" hint-size="20px,20px"></dc-import></span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700;">之后</h2>
          <span style="font-size: 14px; line-height: 22px; color: #4A3C31;">这个手机号可以重新注册，用过的统一认证和邮箱也能给新账号认证。</span>
        </span>
      </section>

      <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; box-shadow: inset 0 1px 0 #EFE9E4;">
        <label for="del-code" style="font-size: 13px; color: #6E625B;">先确认是你本人，验证码发到 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; color: #231C18;">138 **** 5678</span></label>
        <span style="height: 48px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 -1.5px 0 #231C18;">
          <input id="del-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="{{code}}" onChange="{{setCode}}" placeholder="6 位数字" style="flex: 1; min-width: 0; height: 46px; border: 0; outline: none; background: transparent; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #231C18; letter-spacing: 4px;">
          <button type="button" class="btn-light" style="flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 14px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">获取验证码</button>
        </span>
      </div>
    </article>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 32px; background: #FFFFFF; box-shadow: 0 -1px 0 #EFE9E4; display: flex; flex-direction: column; gap: 8px;">
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
        <button type="button" class="btn-solid" onClick="{{submit}}" style="height: 52px; border: 0; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">申请注销</button>
      </sc-if>
      <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
        <button type="button" disabled style="height: 52px; border: 0; border-radius: 26px; background: #E9E2DC; color: #8A7E76; font-size: 16px; font-weight: 600; cursor: not-allowed;">申请注销</button>
        <span style="text-align: center; font-size: 13px; color: #A8321C;">填好验证码才能申请</span>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <section role="status" style="position: absolute; left: 20px; right: 20px; top: 200px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
      <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="time" size="30" hint-size="30px,30px"></dc-import></span>
      <h1 style="margin: 4px 0 0; font-size: 24px; line-height: 32px; font-weight: 900;">已申请注销</h1>
      <p style="margin: 0; font-size: 15px; line-height: 24px; color: #4A3C31;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;">10</span> 月 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;">29</span> 日彻底删除。改主意了，在那之前重新登录就能撤销。</p>
      <a href="G-Login.dc.html" class="btn-light" style="align-self: stretch; margin-top: 18px; height: 52px; border-radius: 26px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">好的</a>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: '', done: false };
  }
  renderVals() {
    const ready = this.state.code.length === 6;
    return {
      code: this.state.code,
      ready: ready,
      notReady: !ready,
      editing: !this.state.done,
      done: this.state.done,
      setCode: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6) }),
      submit: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
