<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 信息有误</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
textarea::placeholder{color:#9A8B80}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-Detail.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
    <section style="position: absolute; left: 20px; right: 20px; top: 98px; display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 32px; line-height: 40px; font-weight: 900;">哪里不对<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></h1>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #4A3C31;"><span style="display: flex; color: #6E625B;"><dc-import name="G-Icon" icon="store" size="18" hint-size="18px,18px"></dc-import></span>袁记云饺<span style="color: #6E625B;">万达金街 1 层</span></span>
    </section>

    <div role="radiogroup" aria-label="哪里不对" style="position: absolute; left: 10px; right: 10px; top: 186px; display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="height: 56px; padding: 0 12px; border: 0; border-radius: 20px; background: {{r.bg}}; color: #231C18; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font-size: 16px; font-weight: {{r.w}}; transition: background-color 200ms ease;">
          {{r.name}}
          <span aria-hidden="true" style="flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{r.ring}}; background: {{r.fill}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; transition: background-color 200ms ease, border-color 200ms ease;"><span style="display: flex; opacity: {{r.check}};"><dc-import name="G-Icon" icon="check" size="14" hint-size="14px,14px"></dc-import></span></span>
        </button>
      </sc-for>
    </div>

    <label style="position: absolute; left: 20px; right: 20px; top: 500px; display: flex; flex-direction: column; gap: 6px;">
      <span style="display: flex; justify-content: space-between; font-size: 13px; color: #6E625B;">补充说明，选填<span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">{{len}}</span> / 200</span></span>
      <textarea maxlength="200" value="{{note}}" onChange="{{setNote}}" placeholder="比如：店搬到 2 层了" style="box-sizing: border-box; width: 100%; height: 108px; padding: 12px 14px; border: 0; border-radius: 18px; background: #F4EFEB; resize: none; outline: none; font: inherit; font-size: 15px; line-height: 22px; color: #231C18;"></textarea>
    </label>

    <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 32px; background: #FFFFFF; box-shadow: 0 -1px 0 #EFE9E4;">
      <button type="button" class="btn-solid" onClick="{{submit}}" style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">提交</button>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <section role="status" style="position: absolute; left: 20px; right: 20px; top: 220px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
      <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="check" size="30" hint-size="30px,30px"></dc-import></span>
      <h1 style="margin: 4px 0 0; font-size: 24px; line-height: 32px; font-weight: 900;">收到了</h1>
      <p style="margin: 0; font-size: 15px; line-height: 24px; color: #4A3C31;">核实后在消息里告诉你</p>
      <a href="G-Detail.dc.html" class="btn-light" style="align-self: stretch; margin-top: 18px; height: 52px; border-radius: 26px; background: linear-gradient(180deg, #FBF8F6, #F4EFEB); color: #231C18; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -2px 0 rgba(35,28,24,0.1), 0 1px 2px rgba(35,28,24,0.12), 0 3px 8px rgba(35,28,24,0.06);">回到袁记云饺</a>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 1, note: '', done: false };
  }
  renderVals() {
    const names = ['店名不对', '位置不对', '已经关门了', '和别的店重复', '其他'];
    return {
      reasons: names.map((n, i) => {
        const on = i === this.state.sel;
        return {
          name: n,
          on: on ? 'true' : 'false',
          bg: on ? '#F4EFEB' : 'transparent',
          w: on ? 700 : 400,
          ring: on ? '#231C18' : '#D9D0C9',
          fill: on ? '#231C18' : 'transparent',
          check: on ? 1 : 0,
          pick: () => this.setState({ sel: i })
        };
      }),
      note: this.state.note,
      len: this.state.note.length,
      setNote: (e) => this.setState({ note: e.target.value.slice(0, 200) }),
      editing: !this.state.done,
      done: this.state.done,
      submit: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
