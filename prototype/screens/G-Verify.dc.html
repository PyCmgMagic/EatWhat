<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 认证</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
input::placeholder{color:#B5A79C}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 12px; top: 46px; height: 44px; display: flex; align-items: center; justify-content: space-between;">
    <sc-if value="{{fromSettings}}" hint-placeholder-val="{{ false }}">
      <a href="G-SettingsAccount.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
        <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
      </a>
    </sc-if>
    <span></span>
    <sc-if value="{{fromRegister}}" hint-placeholder-val="{{ true }}">
      <a href="G-HomePhoto.dc.html" style="height: 44px; padding: 0 8px; color: #231C18; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center;">先逛逛</a>
    </sc-if>
  </header>

  <section style="position: absolute; left: 20px; right: 20px; top: 104px; display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 900;">学生认证</h1>
    <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4A3C31;">认证后可以发布、点赞、评论和关注。只用来确认你是山大学生，我们看不到你的统一认证密码。</p>
  </section>

  <sc-if value="{{unverified}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 20px; right: 20px; top: 214px; display: flex; flex-direction: column;">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6E625B;">现在<span style="height: 24px; padding: 0 10px; border-radius: 12px; background: #F4EFEB; color: #231C18; font-size: 13px; font-weight: 600; line-height: 24px;">未认证</span></span>

      <button type="button" style="margin-top: 18px; min-height: 72px; padding: 0; border: 0; background: none; color: #231C18; display: flex; align-items: center; gap: 14px; text-align: left;">
        <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="school" size="22" hint-size="22px,22px"></dc-import></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;">山大统一认证<span style="font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></span>
          <span style="font-size: 13px; line-height: 20px; color: #6E625B;">跳到学校页面，完成后自动回来</span>
        </span>
        <span style="flex: none; color: #6E625B; display: flex;"><dc-import name="G-Icon" icon="external" size="20" hint-size="20px,20px"></dc-import></span>
      </button>

      <div style="height: 1px; background: #EFE9E4; margin: 6px 0;"></div>

      <div style="min-height: 72px; display: flex; align-items: center; gap: 14px;">
        <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #F4EFEB; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="mail" size="22" hint-size="22px,22px"></dc-import></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 700;">山大邮箱</span>
          <span style="font-size: 13px; line-height: 20px; color: #6E625B;">收到链接后点开就完成了</span>
        </span>
      </div>

      <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 14px; padding-left: 58px;">
          <label style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 13px; color: #6E625B;">邮箱</span>
            <input type="email" autocomplete="email" value="{{email}}" onChange="{{setEmail}}" placeholder="@mail.sdu.edu.cn 或 @sdu.edu.cn" style="height: 44px; border: 0; outline: none; background: transparent; box-shadow: inset 0 -1.5px 0 #231C18; font: inherit; font-size: 17px; font-weight: 600; color: #231C18;">
          </label>
          <button type="button" class="btn-solid" onClick="{{send}}" style="height: 48px; border: 0; border-radius: 24px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">发认证链接</button>
        </div>
      </sc-if>

      <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 12px; padding-left: 58px;">
          <p style="margin: 0; display: flex; gap: 8px; font-size: 14px; line-height: 22px; color: #4A3C31;"><span style="flex: none; margin-top: 2px; color: #231C18;"><dc-import name="G-Icon" icon="mailSend" size="18" hint-size="18px,18px"></dc-import></span><span>链接发到了 <strong style="font-weight: 700; color: #231C18;">{{email}}</strong>，去邮箱点开就完成认证。回到这里会自动刷新。</span></p>
          <button type="button" class="btn-solid" onClick="{{done}}" style="height: 48px; border: 0; border-radius: 24px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">我已完成，刷新一下</button>
          <span style="font-size: 13px; color: #6E625B;">没收到？<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">58</span> 秒后可以重发</span>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{verified}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 20px; right: 20px; top: 214px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span aria-hidden="true" style="flex: none; width: 56px; height: 56px; border-radius: 50%; background: #231C18; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><dc-import name="G-Icon" icon="verify" size="28" hint-size="28px,28px"></dc-import></span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 20px; line-height: 28px; font-weight: 900;">已认证</span>
          <span style="font-size: 13px; color: #6E625B;">山大邮箱，<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">10</span> 月 <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">22</span> 日</span>
        </span>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 22px; color: #4A3C31;">认证一次长期有效，毕业后也不收回。刚才被拦下的操作现在可以直接做了。</p>
      <sc-if value="{{fromRegister}}" hint-placeholder-val="{{ true }}">
        <a href="G-HomePhoto.dc.html" class="btn-solid" style="height: 52px; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">去看看今天吃什么</a>
      </sc-if>
    </div>
  </sc-if>

  <p style="position: absolute; left: 20px; right: 20px; bottom: 36px; margin: 0; font-size: 12px; line-height: 18px; color: #6E625B;">一个统一认证身份、一个邮箱只能认证一个账号。校外的同学可以注册和浏览，但没法认证。</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"from":{"editor":"enum","options":["注册后","设置里"],"default":"注册后"},"status":{"editor":"enum","options":["未认证","已认证"],"default":"未认证"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '202100301234@mail.sdu.edu.cn', sent: false, done: false };
  }
  renderVals() {
    const fromSettings = (this.props.from ?? '注册后') === '设置里';
    const verified = this.state.done || (this.props.status ?? '未认证') === '已认证';
    return {
      fromSettings: fromSettings,
      fromRegister: !fromSettings,
      verified: verified,
      unverified: !verified,
      sent: this.state.sent,
      notSent: !this.state.sent,
      email: this.state.email,
      setEmail: (e) => this.setState({ email: e.target.value }),
      send: () => this.setState({ sent: true }),
      done: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
