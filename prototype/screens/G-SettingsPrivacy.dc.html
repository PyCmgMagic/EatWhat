<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G · 隐私</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <header style="position: absolute; left: 8px; right: 16px; top: 46px; height: 44px; display: flex; align-items: center;">
    <a href="G-Settings.dc.html" aria-label="返回" style="width: 44px; height: 44px; color: #231C18; text-decoration: none; display: flex; align-items: center; justify-content: center;">
      <dc-import name="G-Icon" icon="back" size="24" hint-size="24px,24px"></dc-import>
    </a>
  </header>

  <h1 style="position: absolute; left: 20px; top: 98px; margin: 0; font-size: 34px; line-height: 42px; font-weight: 900;">隐私</h1>

  <div style="position: absolute; left: 0; right: 0; top: 160px; display: flex; flex-direction: column; gap: 18px;">
    <section style="display: flex; flex-direction: column;">
      <h2 style="margin: 0; padding: 0 20px 4px; font-size: 13px; font-weight: 600; color: #6E625B;">别人能看到什么</h2>
      <sc-for list="{{lists}}" as="s" hint-placeholder-count="2">
        <div style="min-height: 64px; padding: 8px 20px; box-sizing: border-box; display: flex; align-items: center; gap: 14px;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span id="{{s.id}}" style="font-size: 16px;">{{s.label}}</span>
            <span style="font-size: 13px; line-height: 20px; color: #6E625B;">{{s.sub}}</span>
          </span>
          <button type="button" role="switch" aria-labelledby="{{s.id}}" aria-checked="{{s.on}}" onClick="{{s.flip}}" style="flex: none; width: 52px; height: 32px; padding: 3px; border: 0; border-radius: 16px; background: {{s.track}}; box-shadow: {{s.shadow}}; display: flex; justify-content: {{s.align}}; transition: background-color 180ms ease;">
            <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(35,28,24,0.28);"></span>
          </button>
        </div>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column;">
      <h2 style="margin: 0; padding: 0 20px 4px; font-size: 13px; font-weight: 600; color: #6E625B;">推荐</h2>
      <div style="min-height: 64px; padding: 8px 20px; box-sizing: border-box; display: flex; align-items: center; gap: 14px;">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span id="perso" style="display: flex; align-items: center; gap: 8px; font-size: 16px;">个性化推荐<span style="font-size: 11px; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></span>
          <span style="font-size: 13px; line-height: 20px; color: #6E625B;">参考你赞过、收藏过、评价过的菜和店。关掉后推荐只看大家公认的好菜</span>
        </span>
        <button type="button" role="switch" aria-labelledby="perso" aria-checked="{{perso.on}}" onClick="{{perso.flip}}" style="flex: none; width: 52px; height: 32px; padding: 3px; border: 0; border-radius: 16px; background: {{perso.track}}; box-shadow: {{perso.shadow}}; display: flex; justify-content: {{perso.align}}; transition: background-color 180ms ease;">
          <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(35,28,24,0.28);"></span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column;">
      <h2 style="margin: 0; padding: 0 20px 4px; font-size: 13px; font-weight: 600; color: #6E625B;">屏蔽</h2>
      <a href="G-Blocked.dc.html" style="height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;">
        <dc-import name="G-Icon" icon="block" size="22" hint-size="22px,22px"></dc-import>
        <span style="flex: 1; display: flex; align-items: center; gap: 8px; font-size: 16px;">屏蔽的人<span style="font-size: 11px; line-height: 18px; padding: 0 6px; border: 1px dashed #9A8B80; border-radius: 9px;">待接入</span></span>
        <span style="font-size: 14px; color: #6E625B;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;">2</span> 人</span>
        <span style="display: flex; color: #6E625B;"><dc-import name="G-Icon" icon="chevronRight" size="20" hint-size="20px,20px"></dc-import></span>
      </a>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { following: true, fans: true, perso: true };
  }
  renderVals() {
    const sw = (key) => {
      const on = this.state[key];
      return {
        on: on ? 'true' : 'false',
        track: on ? 'linear-gradient(180deg, #3B312B, #231C18)' : '#E6DED8',
        shadow: on ? 'inset 0 -1px 0 rgba(0,0,0,0.28)' : 'inset 0 1px 2px rgba(35,28,24,0.12)',
        align: on ? 'flex-end' : 'flex-start',
        flip: () => { const next = {}; next[key] = !on; this.setState(next); }
      };
    };
    return {
      lists: [
        Object.assign({ id: 'pub-following', label: '公开我的关注列表', sub: '关掉后别人点开，看到的是「对方没有公开」' }, sw('following')),
        Object.assign({ id: 'pub-fans', label: '公开我的粉丝列表', sub: '关掉后别人点开，看到的是「对方没有公开」' }, sw('fans'))
      ],
      perso: sw('perso')
    };
  }
}
</script>
</body>
</html>
