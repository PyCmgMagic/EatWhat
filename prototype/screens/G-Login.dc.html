<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Noto+Sans+SC:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
a{color:#231C18}a:hover{color:#000000}
.btn-press:active{transform:translateY(1px)}
.btn-solid,.btn-light{transition:transform 90ms ease,box-shadow 90ms ease}
.btn-solid:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.24),0 1px 1px rgba(35,28,24,0.2)!important}
.btn-light:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(35,28,24,0.1),0 1px 1px rgba(35,28,24,0.1)!important}
.spin{animation: tablespin 90s linear infinite;}
@keyframes tablespin{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3C46E; color: #231C18; font-family: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: -405px; top: 300px; width: 1200px; height: 1200px; border-radius: 50%; background: rgba(255,255,255,0.22);"></div>
  <div aria-hidden="true" style="position: absolute; left: -365px; top: 340px; width: 1120px; height: 1120px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.55);"></div>

  <div aria-hidden="true" class="spin" style="position: absolute; left: 195px; top: 900px; width: 0; height: 0;">
    <img src="../assets/dishes/yuntun.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(0deg) translateY(-430px);">
    <img src="../assets/dishes/niunan.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(30deg) translateY(-430px);">
    <img src="../assets/dishes/yangzhi.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(60deg) translateY(-430px);">
    <img src="../assets/dishes/luosifen.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(90deg) translateY(-430px);">

    <img src="../assets/dishes/xiangguo.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(150deg) translateY(-430px);">
    <img src="../assets/dishes/niandoubao.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(180deg) translateY(-430px);">
    <img src="../assets/dishes/jiaozi.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(210deg) translateY(-430px);">
    <img src="../assets/dishes/yuntun.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(240deg) translateY(-430px);">
    <img src="../assets/dishes/yangzhi.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(270deg) translateY(-430px);">
    <img src="../assets/dishes/xiangguo.svg" alt="" style="position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; transform: rotate(300deg) translateY(-430px);">

  <section style="position: absolute; left: 24px; right: 24px; top: 104px; display: flex; flex-direction: column;">
    <span style="font-size: 16px; font-weight: 700;">沙软</span>
    <h1 style="margin: 2px 0 0; font-size: 60px; line-height: 64px; font-weight: 900; letter-spacing: -1.5px;"><span style="display: block;">今天</span><span style="display: block;">吃什么</span></h1>
    <p style="margin: 14px 0 0; font-size: 15px; line-height: 22px; color: #3D3128;">看看软件园的同学都在吃什么，<br>再把你的好店分享出去。</p>
  </section>

  <div style="position: absolute; left: 0; right: 0; top: 624px; bottom: 0; box-sizing: border-box; padding: 24px 20px 30px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px;">
    <sc-if value="{{agreed}}" hint-placeholder-val="{{ true }}">
      <a href="G-PasswordLogin.dc.html" class="btn-solid" style="height: 52px; border-radius: 26px; background: linear-gradient(180deg, #3B312B, #231C18); color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -2px 0 rgba(0,0,0,0.28), 0 1px 2px rgba(35,28,24,0.2), 0 6px 14px rgba(35,28,24,0.16);">登录</a>
    </sc-if>
    <sc-if value="{{notAgreed}}" hint-placeholder-val="{{ false }}">
      <button type="button" disabled style="height: 52px; border: 0; border-radius: 26px; background: #E9E2DC; color: #8A7E76; font-size: 16px; font-weight: 600; cursor: not-allowed;">登录</button>
    </sc-if>

    <label style="display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 13px; line-height: 20px; color: #4A3C31; cursor: pointer;">
      <input type="checkbox" checked="{{agreed}}" onChange="{{toggle}}" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: #231C18;">
      <span>我已阅读并同意<a href="#privacy" style="color: #231C18; font-weight: 600;">《隐私政策》</a>和<a href="#terms" style="color: #231C18; font-weight: 600;">《用户协议》</a><sc-if value="{{notAgreed}}" hint-placeholder-val="{{ false }}"><span style="display: block; color: #A8321C;">勾选后才能登录</span></sc-if></span>
    </label>

    <div style="display: flex; justify-content: center; gap: 4px; font-size: 14px; color: #6E625B;">
      还没有账号？<a href="G-PhoneLogin.dc.html" style="color: #231C18; font-weight: 600;">注册</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { agreed: false };
  }
  renderVals() {
    return {
      agreed: this.state.agreed,
      notAgreed: !this.state.agreed,
      toggle: () => this.setState({ agreed: !this.state.agreed })
    };
  }
}
</script>
