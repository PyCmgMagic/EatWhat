name: Frontend CI and server deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL || 'https://eat.v50to.you/api' }}
      VITE_ENABLE_DEMO: 'false'
      VITE_BUILD_NUMBER: ${{ github.run_number }}
      VITE_MEDIA_BASE_URL: ${{ vars.VITE_MEDIA_BASE_URL }}
      VITE_BAIDU_MAP_AK: ${{ vars.VITE_BAIDU_MAP_AK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify deployment tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_frontend_deploy.py' -v
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Typecheck and build production assets
        working-directory: frontend
        run: npm run build
      - name: Package the tested build
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          BUILD_SEQUENCE: ${{ github.run_number }}
        run: |
          python3 scripts/frontend_deploy.py pack \
            --dist frontend/dist --output release/site.tar.gz \
            --sha "$SOURCE_SHA" --run-id "$BUILD_RUN_ID" \
            --attempt "$BUILD_ATTEMPT" --sequence "$BUILD_SEQUENCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-release
          path: |
            release/site.tar.gz
            release/site.tar.gz.sha256
            scripts/frontend_deploy.py
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: github.repository == 'PyCmgMagic/EatWhat' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: eatwhat-frontend-production
      cancel-in-progress: false
    env:
      FRONTEND_SSH_USER: ${{ secrets.FRONTEND_SSH_USER }}
      FRONTEND_SSH_PRIVATE_KEY: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}
      FRONTEND_SSH_KNOWN_HOSTS: ${{ secrets.FRONTEND_SSH_KNOWN_HOSTS }}
      FRONTEND_SSH_PORT: ${{ vars.FRONTEND_SSH_PORT || '22' }}
      FRONTEND_DEPLOY_PATH: ${{ vars.FRONTEND_DEPLOY_PATH || '/www/wwwroot/eatwhat-frontend' }}
      FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL || 'https://eat.v50to.you' }}
      FRONTEND_API_SMOKE_URL: ${{ vars.FRONTEND_API_SMOKE_URL || 'https://eat.v50to.you/api/recommend/tags' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-release
          path: artifact
      - name: Deploy the exact tested artifact to 64.90.4.196
        run: python3 artifact/scripts/frontend_deploy.py ship --bundle artifact/release/site.tar.gz
